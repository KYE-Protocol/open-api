                        profile_id: { type: string }
                        certification_level: { type: string }
                        state: { type: string }
                        issued_at: { type: string, format: date-time }
                        expires_at: { type: string, format: date-time }
                        revocation_reason: { type: string }
                        conformance_run_id: { type: string }
                  deals:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        customer_tenant_id: { type: string }
                        deal_stage: { type: string }
                        arr_micro_usd: { type: integer }
                        region: { type: string }
                        vertical: { type: string }
                        opened_at: { type: string, format: date-time }
                        closed_at: { type: string, format: date-time }
                  admin_actions:
                    type: array
                    items:
                      type: object
                      properties:
                        action_id: { type: string }
                        action_type: { type: string }
                        tier: { type: string }
                        reason: { type: string }
                        performer_id: { type: string }
