          description: Partner not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: KYE_DB binding missing or partner registry not provisioned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/partners/{id}/certify:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^kye:partner:" } }
    post:
      operationId: admin-post-admin-partners-by-id-certify
      summary: Promote a partner to certified at tier T1–T3
      description: |
        Tier promotion through the single canonical partner-admin
        mutation path (`applyPartnerAdminAction`): atomic D1 batch of the
        `partner_entities` state mutation (`partner_tier='certified'`,
        `status='active'`), an append-only `kye_partner_admin_actions`
        row (§30 WORM) and an `audit_events` row carrying the
        `kye.partner_admin_action.v1` envelope (§0.3). A `tier` of T1, T2
        or T3 is required — Tier 4+ does not exist (constitution §10 §2,
        "No Tier 4"). Owner-only.
      tags: [Partners]
      x-kye-source-file: public/admin/functions/api/v1/admin/partners/[id]/certify.js
      x-kye-emits-envelopes: [kye.partner_admin_action.v1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier]
              properties:
                tier: { type: string, enum: [T1, T2, T3] }
                second_approver_id: { type: string }
                reason: { type: string }
      responses:
        "201":
          description: Certification applied; §0.3 evidence chain recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  action_id: { type: string }
                  attestation_id: { type: string }
                  evidence_pack_id: { type: string }
                  envelope: { type: object, description: "kye.partner_admin_action.v1", additionalProperties: true }
                  partner_id: { type: string }
        "400":
          description: Non-JSON body, invalid partner id, or tier missing / outside T1–T3
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Partner not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: KYE_DB binding missing or partner-admin-actions migration not applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/partners/{id}/renewal:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^kye:partner:" } }
    post:
      operationId: admin-post-admin-partners-by-id-renewal
      summary: Renew a partner's certification validity window
      description: |
        Refreshes the partner's certification window through the single
        canonical partner-admin mutation path, stamping `renewed_at` into
        `body_json` plus the append-only `kye_partner_admin_actions` +
        `audit_events` rows (§30 / §0.3). Non-destructive and
        non-tier-changing, so no dual approval and no tier are required
        (see DESTRUCTIVE_ACTIONS / TIER_REQUIRED_ACTIONS). The
        `renewal` action_type was already implemented in the shared
        library; only this HTTP binding was missing, so the console's
        "Renew certification" control posted to a 404. Owner-only.
      tags: [Partners]
      x-kye-source-file: public/admin/functions/api/v1/admin/partners/[id]/renewal.js
      x-kye-emits-envelopes: [kye.partner_admin_action.v1]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: "Optional note recorded on the action row" }
      responses:
        "201":
          description: Renewal applied; §0.3 evidence chain recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  action_id: { type: string }
                  attestation_id: { type: string }
                  evidence_pack_id: { type: string }
                  envelope: { type: object, description: "kye.partner_admin_action.v1", additionalProperties: true }
                  partner_id: { type: string }
        "400":
          description: Non-JSON body or invalid partner id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Unknown partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/partners/{id}/revoke:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^kye:partner:" } }
    post:
      operationId: admin-post-admin-partners-by-id-revoke
      summary: Revoke a partner (destructive; dual-approval required)
      description: |
        Destructive revocation through the single canonical partner-admin
        mutation path: `partner_entities.status` flips to `offboarding`
        with `offboarded_at` stamped, plus the append-only
        `kye_partner_admin_actions` + `audit_events` rows (§30 / §0.3).
        Banking-grade dual approval (constitution §0.4): the body MUST
        carry a `reason` of ≥ 20 characters and a `second_approver_id`
        distinct from the performer. Idempotent — revoking a partner
        already in `offboarding` returns 200 with `idempotent: true`. On
        success a `kye.lifecycle.compensating.v1` message is enqueued to
        KYE_LIFECYCLE_QUEUE for downstream compensation. Owner-only.
      tags: [Partners]
      x-kye-source-file: public/admin/functions/api/v1/admin/partners/[id]/revoke.js
      x-kye-emits-envelopes: [kye.partner_admin_action.v1, kye.lifecycle.compensating.v1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, second_approver_id]
              properties:
                reason: { type: string, minLength: 20 }
                second_approver_id: { type: string, description: "Must differ from the performing operator" }
      responses:
        "200":
          description: Partner already offboarding — idempotent no-op
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  idempotent: { type: boolean, enum: [true] }
                  partner_id: { type: string }
                  status: { type: string, enum: [offboarding] }
        "201":
          description: Revocation applied; §0.3 evidence chain recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  action_id: { type: string }
                  attestation_id: { type: string }
                  evidence_pack_id: { type: string }
                  envelope: { type: object, description: "kye.partner_admin_action.v1", additionalProperties: true }
                  partner_id: { type: string }
        "400":
          description: Non-JSON body, invalid partner id, reason under 20 chars, or second approver missing / same as performer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Partner not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: KYE_DB binding missing or partner-admin-actions migration not applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/partners/applications/list:
    get:
      operationId: admin-get-admin-partners-applications-list
      summary: List partner engagement applications by workflow status
      description: |
        Reads `engagement_applications` filtered to
        `engagement_type='partner'` and the requested `status` (default
        `pending`), falling back to the legacy `partner_applications`
        table when the §49 store returns no rows — the response's
        `source` field reports which table served the data. Also returns
        a per-status `counts` roll-up over the partner engagement queue.
        Paginated via `limit` (max 500) + `offset`. Owner-only,
        read-only. Constitution §10 §8.1 + §49 §3.
      tags: [Partners]
      x-kye-source-file: public/admin/functions/api/v1/admin/partners/applications/list.js
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, approved, rejected, changes_requested], default: pending }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 100, maximum: 500 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200":
          description: Applications + per-status counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  source: { type: string, description: "engagement_applications, or partner_applications (legacy)" }
                  status: { type: string }
                  count: { type: integer }
                  counts:
                    type: object
                    additionalProperties: { type: integer }
                  applications:
                    type: array
                    items:
                      type: object
                      properties:
                        application_id: { type: string }
                        applicant_name: { type: string }
                        applicant_email: { type: string }
                        org_name: { type: string }
                        engagement_type: { type: string }
                        requested_tier: { type: string }
                        workflow_status: { type: string }
                        submitted_at: { type: string, format: date-time }
                        received_at: { type: string, format: date-time }
                        body_json: { type: string }
        "400":
          description: Unknown status value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/partners/applications/{id}/grant:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "engagement_applications.application_id" }
    post:
      operationId: admin-post-admin-partners-applications-by-id-grant
      summary: Approve a partner application and create the partner entity
      description: |
        Atomic D1 batch: flips the application's `workflow_status` to
        `approved` (in `engagement_applications`, falling back to the
        legacy `partner_applications` table) and inserts a Tier-1
        baseline `partner_entities` row whose ID is minted as
        `kye:partner:<org-slug>.<6-char-uuid>`. The optional `tier` body
        field (T1–T3, default T1) is recorded on the grant; the §0.3
        evidence chain (action row + `kye.partner_admin_action.v1`
        envelope) is then emitted via the canonical partner-admin
        mutation path. Idempotent — an already-approved application
        returns 200 with `idempotent: true`. Constitution §10 + §49 §3.
      tags: [Partners]
      x-kye-source-file: public/admin/functions/api/v1/admin/partners/applications/[id]/grant.js
      x-kye-emits-envelopes: [kye.partner_admin_action.v1]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tier: { type: string, enum: [T1, T2, T3], default: T1 }
                reason: { type: string }
                second_approver_id: { type: string }
      responses:
        "200":
          description: Application already approved — idempotent no-op
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  idempotent: { type: boolean, enum: [true] }
                  application_id: { type: string }
                  workflow_status: { type: string, enum: [approved] }
        "201":
          description: Grant applied; partner entity created; §0.3 evidence chain recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  action_id: { type: string }
                  attestation_id: { type: string }
                  evidence_pack_id: { type: string }
                  envelope: { type: object, description: "kye.partner_admin_action.v1", additionalProperties: true }
                  partner_id: { type: string }
        "400":
          description: Missing application id path parameter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Application not found in either store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: KYE_DB binding missing or partner registry not provisioned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/partners/applications/{id}/reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "engagement_applications.application_id" }
    post:
      operationId: admin-post-admin-partners-applications-by-id-reject
      summary: Reject a partner application (dual-approval required)
      description: |
        Flips the application's `workflow_status` to `rejected` (in
        `engagement_applications`, falling back to the legacy
        `partner_applications` table), then records a retired synthetic
        `kye:partner:rejected-application.<id>` entity so the rejection
        flows through the same canonical partner-admin audit path
        (`kye_partner_admin_actions` + `kye.partner_admin_action.v1`
        envelope, §0.3 / §30). Banking-grade dual approval (§0.4): the
        body MUST carry a `reason` of ≥ 20 characters and a
        `second_approver_id`. Constitution §10 + §49 §3.
      tags: [Partners]
      x-kye-source-file: public/admin/functions/api/v1/admin/partners/applications/[id]/reject.js
      x-kye-emits-envelopes: [kye.partner_admin_action.v1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, second_approver_id]
              properties:
                reason: { type: string, minLength: 20 }
                second_approver_id: { type: string }
      responses:
        "201":
          description: Rejection applied; §0.3 evidence chain recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  action_id: { type: string }
                  attestation_id: { type: string }
                  evidence_pack_id: { type: string }
                  envelope: { type: object, description: "kye.partner_admin_action.v1", additionalProperties: true }
                  partner_id: { type: string, description: "Synthetic kye:partner:rejected-application.* entity" }
        "400":
          description: Non-JSON body, missing application id, reason under 20 chars, or second approver missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Application not found in either store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: KYE_DB binding missing or partner registry not provisioned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Agent Library adoption ────────────────────────────────────────────────
  /agents/from-library:
    get:
      operationId: admin-get-agents-from-library
      summary: List a tenant's Agent Library™ adoptions
      description: |
        Lists every adoption for the given tenant across both adoption
        modes — `agent_subscriptions` (mode `subscription`) and
        `agent_derivations` (mode `derivation`) — merged into one
        `adoptions[]` array sorted newest-first by adoption / derivation
        timestamp. `tenant_id` is required and must start with
        `kye:tenant:`. Derivation rows inline their parsed overrides.
        Owner-only, read-only.
      tags: [AgentLibrary]
      x-kye-source-file: public/admin/functions/api/v1/agents/from-library.js
      parameters:
        - { name: tenant_id, in: query, required: true, schema: { type: string, pattern: "^kye:tenant:" } }
      responses:
        "200":
          description: Subscriptions + derivations for the tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  tenant_id: { type: string }
                  total: { type: integer }
                  subscriptions: { type: integer }
                  derivations: { type: integer }
                  adoptions:
                    type: array
                    items:
                      type: object
                      properties:
                        adoption_mode: { type: string, enum: [subscription, derivation] }
                        subscription_id: { type: string }
                        derivation_id: { type: string }
                        library_id: { type: string }
                        agent_local_id: { type: string }
                        status: { type: string }
                        adopted_by: { type: string }
                        adopted_at: { type: string, format: date-time }
                        revoked_at: { type: string, format: date-time }
                        overrides: { type: object, additionalProperties: true }
                        derived_at: { type: string, format: date-time }
                        derived_by: { type: string }
        "400":
          description: tenant_id missing or not a kye:tenant:* ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: admin-post-agents-from-library
      summary: Adopt a published Agent Library™ entry into a tenant
      description: |
        Adopts a published `agent_library_entries` row into the caller's
        tenant. The entry's `machine_seal` (sha256 over the canonical
        JSON body) is recomputed and verified before adoption — a
        mismatch returns 409. Mode `subscription` (default) inserts an
        `agent_subscriptions` row; mode `derivation` validates the
        overrides (additive only — `removed_*` keys are forbidden and a
        `deny:` on a platform-locked capability is rejected) and inserts
        an `agent_derivations` row. Both inserts are idempotent
        (INSERT OR REPLACE on the deterministic tenant-scoped ID).
        Owner-only.
      tags: [AgentLibrary]
      x-kye-source-file: public/admin/functions/api/v1/agents/from-library.js
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, library_id, agent_local_id]
              properties:
                tenant_id: { type: string, pattern: "^kye:tenant:" }
                library_id: { type: string, pattern: "^kye:agent-library:" }
                agent_local_id: { type: string, description: "Tenant-local identifier; lowercased and slug-sanitised" }
                adoption_mode: { type: string, enum: [subscription, derivation], default: subscription }
                overrides:
                  type: object
                  description: Derivation mode only — additive overrides
                  properties:
                    added_triggers: { type: array, items: { type: string } }
                    added_inputs: { type: array, items: { type: string } }
                    added_outputs: { type: array, items: { type: string } }
                    added_obligations: { type: array, items: { type: string } }
                    tightened_capabilities: { type: array, items: { type: string } }
      responses:
        "200":
          description: Adoption recorded (subscription or derivation) with seal_verified=true
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  adoption_mode: { type: string, enum: [subscription, derivation] }
                  subscription_id: { type: string }
                  derivation_id: { type: string }
                  tenant_id: { type: string }
                  library_id: { type: string }
                  agent_local_id: { type: string }
                  seal_verified: { type: boolean, enum: [true] }
                  overrides_applied:
                    type: object
                    description: Per-override-key counts (derivation mode only)
                    additionalProperties: { type: integer }
        "400":
          description: Bad tenant/library id, missing agent_local_id, non-JSON body, or forbidden derivation override
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Library entry not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: machine_seal mismatch — stored entry failed seal re-verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── GovernedUI approval queue (§36 module 6) ──────────────────────────────
  /approval-queue:
    get:
      operationId: admin-get-approval-queue
      summary: Cross-tenant view of the GovernedUI action-approval queue
      description: |
        Reads the `app_action_approvals` table (owned by the KYE Cloud
        action-approvals surface — §0 forbids a duplicate runtime
        CREATE TABLE here) cross-tenant, newest 500 proposals first.
        `view` selects a canned SQL condition: pending (default),
        high-risk, escalated, second-approval-pending, or decided.
        Additional filters: `risk_level` and free-text `q` over
        proposal_id / actor_id / action_type / tenant_id. Returns a KPI
        block (pending, high_risk, escalated, second_approval). Fails
        silent (empty list) on a cold DB. Owner-only, read-only.
        Schema authority: kye.governedui.action_proposal.v1.
      tags: [ApprovalQueue]
      x-kye-source-file: public/admin/functions/api/v1/approval-queue.js
      parameters:
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [pending, high-risk, escalated, second-approval-pending, decided], default: pending }
        - name: risk_level
          in: query
          required: false
          schema: { type: string, enum: [low, medium, high, critical] }
        - { name: q, in: query, required: false, schema: { type: string }, description: "LIKE on proposal_id / actor_id / action_type / tenant_id" }
      responses:
        "200":
          description: Action proposals + KPI counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  view: { type: string }
                  count: { type: integer }
                  kpi:
                    type: object
                    properties:
                      pending: { type: integer }
                      high_risk: { type: integer }
                      escalated: { type: integer }
                      second_approval: { type: integer }
                  proposals:
                    type: array
                    items:
                      type: object
                      properties:
                        proposal_id: { type: string }
                        tenant_id: { type: string }
                        actor_id: { type: string }
                        action_type: { type: string }
                        target_system: { type: string }
                        risk_level: { type: string }
                        approval_mode: { type: string }
                        state: { type: string }
                        proposed_at: { type: string, format: date-time }
                        decided_at: { type: string, format: date-time }
                        decided_by: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Assurance Card issuance ───────────────────────────────────────────────
  /assurance-issuance:
    get:
      operationId: admin-get-assurance-issuance
      summary: List issued Assurance Cards with issuance KPI
      description: |
        Lists the newest 500 rows from `assurance_cards` with optional
        filters by tenant_id, framework (SOC2 / ISO27001 / ISO42001 /
        EU_AI_ACT / DORA / FCA_OPRES) and status (active / expiring /
        revoked). Returns a KPI block: issued in the last 30 days, active
        count, active cards expiring within 30 days, and revocations in
        the last 90 days. Owner-only, read-only.
      tags: [Assurance]
      x-kye-source-file: public/admin/functions/api/v1/assurance-issuance.js
      parameters:
        - { name: tenant_id, in: query, required: false, schema: { type: string } }
        - name: framework
          in: query
          required: false
          schema: { type: string, enum: [SOC2, ISO27001, ISO42001, EU_AI_ACT, DORA, FCA_OPRES] }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, expiring, revoked] }
      responses:
        "200":
          description: Assurance Cards + KPI
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  count: { type: integer }
                  kpi:
                    type: object
                    properties:
                      issued_30d: { type: integer }
                      active: { type: integer }
                      expiring: { type: integer }
                      revoked_90d: { type: integer }
                  assurance_cards:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        tenant_id: { type: string }
                        framework: { type: string }
                        scope: { type: string }
                        signed_by_kid: { type: string }
                        issued_by: { type: string }
                        issued_at: { type: string, format: date-time }
                        expires_at: { type: string, format: date-time }
                        status: { type: string }
                        revoked_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: admin-post-assurance-issuance
      summary: Issue a new Assurance Card for a tenant
      description: |
        Inserts an `assurance_cards` row with status `active` and a
        90-day expiry (the §0.3 ≤90-day rotation window). Requires a
        `kye:tenant:*` tenant_id, one of the six locked frameworks, and a
        non-empty scope (≤ 500 chars). The card ID is minted as
        `kye:assurance:<tenant-slug>.<framework>.<8-char-uuid>` and the
        signing kid is resolved from the HSM key-registry context. The
        issuing operator (Clerk session email) is recorded as
        `issued_by`. Owner-only.
      tags: [Assurance]
      x-kye-source-file: public/admin/functions/api/v1/assurance-issuance.js
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, framework, scope]
              properties:
                tenant_id: { type: string, pattern: "^kye:tenant:" }
                framework: { type: string, enum: [SOC2, ISO27001, ISO42001, EU_AI_ACT, DORA, FCA_OPRES] }
                scope: { type: string, maxLength: 500 }
                notes: { type: string, maxLength: 4000 }
      responses:
        "201":
          description: Assurance Card issued with 90-day expiry
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  assurance_card:
                    type: object
                    properties:
                      id: { type: string }
                      tenant_id: { type: string }
                      framework: { type: string }
                      scope: { type: string }
                      signed_by_kid: { type: string }
                      issued_by: { type: string }
                      issued_at: { type: string, format: date-time }
                      expires_at: { type: string, format: date-time }
                      status: { type: string, enum: [active] }
        "400":
          description: Non-JSON body, bad tenant_id, invalid framework, or missing scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Billing roll-up (§23 §11) ─────────────────────────────────────────────
  /billing/all:
    get:
      operationId: admin-get-billing-all
      summary: Stripe customer roll-up across all tenants
      description: |
        Cross-tenant revenue view (constitution §23 §11): assembles
        tenants × `billing_customers` × `billing_usage_current_cycle`
        as a LEFT-JOIN-style merge in JS so tenants without a
        subscription appear with `billing: null`. Returns aggregates
        (tenant_count, with_subscription, MRR in cents and USD, ARR
        run-rate, overage cents, dunning count) and the dunning rows.
        Honest empty state: zero tenants returns empty arrays with
        `honest_empty_state: true`. Owner-only, read-only.
      tags: [Billing]
      x-kye-source-file: public/admin/functions/api/v1/billing/all.js
      responses:
        "200":
          description: Per-tenant billing rows + cross-tenant aggregates
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  tenants:
                    type: array
                    items:
                      type: object
                      properties:
                        tenant_id: { type: string }
                        name: { type: string }
                        slug: { type: string }
                        env: { type: string }
                        contract_status: { type: string }
                        sla_tier: { type: string }
                        owner_email: { type: string }
                        billing:
                          type: object
                          description: billing_customers row, or null when no subscription
                          additionalProperties: true
                        usage:
                          type: object
                          description: billing_usage_current_cycle row, or null
                          additionalProperties: true
                  aggregates:
                    type: object
                    properties:
                      tenant_count: { type: integer }
                      with_subscription: { type: integer }
                      mrr_cents: { type: integer }
                      mrr_usd: { type: number }
                      arr_run_rate_usd: { type: number }
                      overage_cents: { type: integer }
                      dunning_count: { type: integer }
                  dunning:
                    type: array
                    items: { type: object, additionalProperties: true }
                  honest_empty_state: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

