      responses:
        "200":
          description: Partner detail + related rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  partner:
                    type: object
                    properties:
                      id: { type: string }
                      legal_name: { type: string }
                      display_name: { type: string }
                      partner_tier: { type: string }
                      region: { type: string }
                      jurisdiction: { type: string }
                      primary_contact_email: { type: string }
                      technical_contact_email: { type: string }
                      status: { type: string }
                      onboarded_at: { type: string, format: date-time }
                      offboarded_at: { type: string, format: date-time }
