      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: admin-patch-state-events-by-id
      summary: Always returns 405 — state events are immutable
      description: |
        PATCH (like DELETE) is exported by the handler but always returns
        405 with `error: "state_events_are_immutable"`. State events are
        append-only under the §13 Resilience Loop™ + §30 WORM contract.
        To represent a correction, fire a compensating transition via
        POST /state-transitions. This operation exists so the OpenAPI ↔
        Functions bijection gate observes the exported handler; callers
        never receive a 2XX from this verb.
      tags: [StateRegistry]
      x-kye-source-file: public/admin/functions/api/v1/state-events/[id].js
      responses:
        default:
          description: State-event PATCH is unconditionally rejected with 405 — see the 405 response below. The `default` response is declared so the OpenAPI 2XX-coverage rule is satisfied without lying about a 200 path that does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "405":
          description: State events are immutable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: admin-delete-state-event
      summary: Always returns 405 — state events are immutable
      description: |
        DELETE (and PATCH) are exported by the handler but always return 405
        with `error: "state_events_are_immutable"`. State events are
        append-only under the §13 Resilience Loop™ + §30 WORM contract.
        To represent a reversal, fire a compensating transition via
        POST /state-transitions. This operation exists so the OpenAPI ↔
        Functions bijection gate observes the exported handler; callers
        never receive a 2XX from this verb.
      tags: [StateRegistry]
      x-kye-source-file: public/admin/functions/api/v1/state-events/[id].js
      responses:
        default:
          description: State-event DELETE is unconditionally rejected with 405 — see the 405 response below. The `default` response is declared so the OpenAPI 2XX-coverage rule is satisfied without lying about a 200 path that does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "405":
          description: State events are immutable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

