openapi: "3.1.0"
info:
  title: KYE Protocol™ Admin API
  version: "1.0.0"
  description: |
    Owner-only REST surface for admin.kyeprotocol.com.
    All endpoints require a Clerk JWT with role=owner.
    Operates against Cloudflare D1 (KYE_DB binding).

servers:
  - url: https://admin.kyeprotocol.com/api/v1
    description: Production admin surface

security:
  - ClerkBearer: []

components:
  securitySchemes:
    ClerkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk RS256 JWT with public_metadata.role=owner

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Role not owner
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: string

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]

    Tenant:
      type: object
      properties:
        id: { type: string, example: "kye:tenant:acme" }
        slug: { type: string }
        name: { type: string }
        env: { type: string, enum: [prod, sandbox] }
        clerk_org_id: { type: [string, "null"] }
        owner_email: { type: [string, "null"] }
        contract_status: { type: string }
        sla_tier: { type: string }
        region: { type: string }
        state: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        activated_at: { type: [string, "null"], format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }
        notes: { type: [string, "null"] }

paths:
  # ── Tenants ────────────────────────────────────────────────────────────────
  /tenants:
    get:
      operationId: admin.listTenants
      summary: List all active tenants
      tags: [Tenants]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - type: object
                    properties:
                      tenants:
                        type: array
                        items:
                          $ref: "#/components/schemas/Tenant"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: admin.createTenant
      summary: Create a tenant
      tags: [Tenants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                slug: { type: string }
                env: { type: string, enum: [prod, sandbox] }
                region: { type: string }
                owner_email: { type: string }
                clerk_org_id: { type: string }
                contract_status: { type: string }
                sla_tier: { type: string }
                notes: { type: string }
      responses:
        "201":
          description: Created
        "400": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Slug already taken

  /tenants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: admin.getTenant
      summary: Get tenant by ID
      tags: [Tenants]
      responses:
        "200":
          description: OK
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: admin.updateTenant
      summary: Update tenant
      tags: [Tenants]
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: admin.deleteTenant
      summary: Soft-delete tenant
      tags: [Tenants]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Legal Entities ─────────────────────────────────────────────────────────
  /legal-entities:
    get:
      operationId: listLegalEntities
      summary: List legal entities
      tags: [LegalEntities]
      parameters:
        - name: tenant_id
          in: query
          schema: { type: string }
      responses:
        "200": { description: OK }
    post:
      operationId: createLegalEntity
      summary: Create legal entity
      tags: [LegalEntities]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, legal_name, form, country_code]
      responses:
        "201": { description: Created }

  /legal-entities/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getLegalEntity
      tags: [LegalEntities]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateLegalEntity
      tags: [LegalEntities]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: OK }
    delete:
      operationId: deleteLegalEntity
      tags: [LegalEntities]
      responses:
        "200": { description: OK }

  # ── Billing Accounts ───────────────────────────────────────────────────────
  /billing-accounts:
    get:
      operationId: listBillingAccounts
      tags: [BillingAccounts]
      parameters:
        - { name: tenant_id, in: query, schema: { type: string } }
      responses:
        "200": { description: OK }
    post:
      operationId: createBillingAccount
      tags: [BillingAccounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, billing_email]
      responses:
        "201": { description: Created }

  /billing-accounts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getBillingAccount
      tags: [BillingAccounts]
      responses:
        "200": { description: OK }
    patch:
      operationId: updateBillingAccount
      tags: [BillingAccounts]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: OK }
    delete:
      operationId: admin-delete-billing-accounts-by-id
      summary: Always returns 405 — billing accounts are never hard-deleted
      description: |
        DELETE is exported by the handler but unconditionally returns 405
        with `error: "billing_accounts_cannot_be_deleted"` and the hint
        to set `state=closed` via PATCH instead. Billing records are
        financial audit artefacts; removal would break the §30 WORM
        retention contract. This operation exists so the OpenAPI ↔
        Functions bijection gate observes the exported handler; callers
        never receive a 2XX from this verb.
      tags: [BillingAccounts]
      x-kye-source-file: public/admin/functions/api/v1/billing-accounts/[id].js
      responses:
        default:
          description: Billing-account DELETE is unconditionally rejected with 405 — see the 405 response below. The `default` response is declared so the OpenAPI 2XX-coverage rule is satisfied without lying about a 200 path that does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "405":
          description: Billing accounts cannot be deleted — close via PATCH state=closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Domains ────────────────────────────────────────────────────────────────
  /domains:
    get:
      operationId: listDomains
      tags: [Domains]
      parameters:
        - { name: tenant_id, in: query, schema: { type: string } }
      responses:
        "200": { description: OK }
    post:
      operationId: createDomain
      tags: [Domains]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, fqdn]
      responses:
        "201": { description: Created }

  /domains/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getDomain
      tags: [Domains]
      responses:
        "200": { description: OK }
    patch:
      operationId: updateDomain
      tags: [Domains]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: OK }
    delete:
      operationId: deleteDomain
      tags: [Domains]
      responses:
        "200": { description: OK }

  # ── Policies ───────────────────────────────────────────────────────────────
  /policies:
    get:
      operationId: listPolicies
      tags: [Policies]
      parameters:
        - { name: tenant_id, in: query, schema: { type: string } }
        - { name: regime, in: query, schema: { type: string } }
      responses:
        "200": { description: OK }
    post:
      operationId: createPolicy
      tags: [Policies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, regime]
      responses:
        "201": { description: Created }

  /policies/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getPolicy
      tags: [Policies]
      responses:
        "200": { description: OK }
    patch:
      operationId: updatePolicy
      tags: [Policies]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: OK }
    delete:
      operationId: admin-delete-policies-by-id
      summary: Always returns 405 — admin policies are append-only audit artefacts
      description: |
        DELETE is exported by the handler but unconditionally returns 405
        with `error: "policies_are_immutable"` and the hint to set
        `state=retired` via PATCH instead. Compiled policies carry
        signatures and integrity seals and are referenced from evidence
        chains, so removal is forbidden. This operation exists so the
        OpenAPI ↔ Functions bijection gate observes the exported handler;
        callers never receive a 2XX from this verb.
      tags: [Policies]
      x-kye-source-file: public/admin/functions/api/v1/policies/[id].js
      responses:
        default:
          description: Policy DELETE is unconditionally rejected with 405 — see the 405 response below. The `default` response is declared so the OpenAPI 2XX-coverage rule is satisfied without lying about a 200 path that does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "405":
          description: Policies are immutable — retire via PATCH state=retired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Workspaces ─────────────────────────────────────────────────────────────
  /workspaces:
    get:
      operationId: admin.listWorkspaces
      tags: [Workspaces]
      parameters:
        - { name: tenant_id, in: query, schema: { type: string } }
      responses:
        "200": { description: OK }
    post:
      operationId: admin.createWorkspace
      tags: [Workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, name]
      responses:
        "201": { description: Created }

  /workspaces/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: admin.getWorkspace
      tags: [Workspaces]
      responses:
        "200": { description: OK }
    patch:
      operationId: admin.updateWorkspace
      tags: [Workspaces]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: OK }
    delete:
      operationId: admin.deleteWorkspace
      tags: [Workspaces]
      responses:
        "200": { description: OK }

  # ── Projects ───────────────────────────────────────────────────────────────
  /projects:
    get:
      operationId: admin.listProjects
      tags: [Projects]
      parameters:
        - { name: tenant_id, in: query, schema: { type: string } }
        - { name: workspace_id, in: query, schema: { type: string } }
      responses:
        "200": { description: OK }
    post:
      operationId: admin.createProject
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, workspace_id, name]
      responses:
        "201": { description: Created }

  /projects/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: admin.getProject
      tags: [Projects]
      responses:
        "200": { description: OK }
    patch:
      operationId: admin.updateProject
      tags: [Projects]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: OK }
    delete:
      operationId: archiveProject
      tags: [Projects]
      responses:
        "200": { description: OK }

  # ── Teams ──────────────────────────────────────────────────────────────────
  /teams:
    get:
      operationId: admin.listTeams
      tags: [Teams]
      parameters:
        - { name: tenant_id, in: query, schema: { type: string } }
        - { name: workspace_id, in: query, schema: { type: string } }
      responses:
        "200": { description: OK }
    post:
      operationId: admin.createTeam
      tags: [Teams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, name]
      responses:
        "201": { description: Created }

  /teams/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: admin.getTeam
      tags: [Teams]
      responses:
        "200": { description: OK }
    patch:
      operationId: admin.updateTeam
      tags: [Teams]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: OK }
    delete:
      operationId: admin.deleteTeam
      tags: [Teams]
      responses:
        "200": { description: OK }

  # ── Principals ─────────────────────────────────────────────────────────────
  /principals:
    get:
      operationId: admin.listPrincipals
      tags: [Principals]
      parameters:
        - { name: tenant_id, in: query, schema: { type: string } }
        - { name: principal_class, in: query, schema: { type: string } }
      responses:
        "200": { description: OK }
    post:
      operationId: admin.createPrincipal
      tags: [Principals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, principal_class, display_name]
      responses:
        "201": { description: Created }

  /principals/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: admin.getPrincipal
      tags: [Principals]
      responses:
        "200": { description: OK }
    patch:
      operationId: admin.updatePrincipal
      tags: [Principals]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: OK }
    delete:
      operationId: admin.deletePrincipal
      tags: [Principals]
      responses:
        "200": { description: OK }

  # ── Resources ──────────────────────────────────────────────────────────────
  /resources:
    get:
      operationId: admin.listResources
      tags: [Resources]
      parameters:
        - { name: tenant_id, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: workspace_id, in: query, schema: { type: string } }
      responses:
        "200": { description: OK }
    post:
      operationId: admin.createResource
      tags: [Resources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, kind, name]
      responses:
        "201": { description: Created }

  /resources/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: admin.getResource
      tags: [Resources]
      responses:
        "200": { description: OK }
    patch:
      operationId: admin.updateResource
      tags: [Resources]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: OK }
    delete:
      operationId: admin.deleteResource
      tags: [Resources]
      responses:
        "200": { description: OK }

  # ── Models ─────────────────────────────────────────────────────────────────
  /models:
    get:
      operationId: listModels
      tags: [Models]
      parameters:
        - { name: tenant_id, in: query, schema: { type: string } }
        - { name: risk_tier, in: query, schema: { type: string } }
      responses:
        "200": { description: OK }
    post:
      operationId: createModel
      tags: [Models]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, model_provider, model_family, version]
      responses:
        "201": { description: Created }

  /models/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getModel
      tags: [Models]
      responses:
        "200": { description: OK }
    patch:
      operationId: updateModel
      tags: [Models]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: OK }
    delete:
      operationId: retireModel
      tags: [Models]
      responses:
        "200": { description: OK }

  # ── Tools ──────────────────────────────────────────────────────────────────
  /tools:
    get:
      operationId: listTools
      tags: [Tools]
      parameters:
        - { name: tenant_id, in: query, schema: { type: string } }
        - { name: workspace_id, in: query, schema: { type: string } }
      responses:
        "200": { description: OK }
    post:
      operationId: createTool
      tags: [Tools]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, name, function_signature]
      responses:
        "201": { description: Created }

  /tools/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getTool
      tags: [Tools]
      responses:
        "200": { description: OK }
    patch:
      operationId: updateTool
      tags: [Tools]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: OK }
    delete:
      operationId: deprecateTool
      tags: [Tools]
      responses:
        "200": { description: OK }

  # ── External Apps ──────────────────────────────────────────────────────────
  /external-apps:
    get:
      operationId: listExternalApps
      tags: [ExternalApps]
      parameters:
        - { name: tenant_id, in: query, schema: { type: string } }
        - { name: connector_kind, in: query, schema: { type: string } }
      responses:
        "200": { description: OK }
    post:
      operationId: createExternalApp
      tags: [ExternalApps]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, vendor_name, connector_kind]
      responses:
        "201": { description: Created }

  /external-apps/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getExternalApp
      tags: [ExternalApps]
      responses:
        "200": { description: OK }
    patch:
      operationId: updateExternalApp
      tags: [ExternalApps]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: OK }
    delete:
      operationId: revokeExternalApp
      tags: [ExternalApps]
      responses:
        "200": { description: OK }

  # ── Audit Streams ──────────────────────────────────────────────────────────
  /audit-streams:
    get:
      operationId: listAuditStreams
      tags: [AuditStreams]
      parameters:
        - { name: tenant_id, in: query, schema: { type: string } }
      responses:
        "200": { description: OK }
    post:
      operationId: createAuditStream
      tags: [AuditStreams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
      responses:
        "201": { description: Created }

  /audit-streams/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getAuditStream
      tags: [AuditStreams]
      responses:
        "200": { description: OK }
    patch:
      operationId: updateAuditStream
      tags: [AuditStreams]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: OK }
    delete:
      operationId: admin-reject-delete-audit-stream
      summary: Always returns 405 — audit streams are immutable
      description: |
        DELETE is exported by the handler but always returns 405 with
        `error: "audit_streams_are_immutable"`. Audit streams are
        append-only under §30 WORM Retention. To retire a stream, PATCH it
        with `state: "sealed"`. This operation exists so the OpenAPI ↔
        Functions bijection gate observes the exported handler; callers
        never receive a 2XX from this verb.
      tags: [AuditStreams]
      x-kye-source-file: public/admin/functions/api/v1/audit-streams/[id].js
      responses:
        default:
          description: Audit-stream DELETE is unconditionally rejected with 405 — see the 405 response below. The `default` response is declared so the OpenAPI 2XX-coverage rule is satisfied without lying about a 200 path that does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "405":
          description: Audit streams are immutable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Relationships ──────────────────────────────────────────────────────────
  /relationships/member-of:
    get:
      operationId: admin.listMemberOf
      tags: [Relationships]
      parameters:
        - { name: team_id, in: query, schema: { type: string } }
        - { name: principal_id, in: query, schema: { type: string } }
      responses:
        "200": { description: OK }
    post:
      operationId: admin.createMemberOf
      tags: [Relationships]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [team_id, principal_id]
      responses:
        "201": { description: Created }

  /relationships/member-of/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: admin-get-relationships-member-of-by-id
      summary: Fetch one team membership
      description: |
        Resolves a single `team_members` row. The composite key is passed
        either as `?team_id=&principal_id=` query params or encoded in the
        path segment as base64url(`team_id|principal_id`). Returns 400 when
        neither form decodes, 404 when no membership exists.
      tags: [Relationships]
      x-kye-source-file: public/admin/functions/api/v1/relationships/member-of/[id].js
      parameters:
        - { name: team_id, in: query, schema: { type: string } }
        - { name: principal_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Membership row
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  member_of:
