  # ── Commercial lifecycle (§27) ────────────────────────────────────────────
  /commercial-lifecycle:
    get:
      operationId: admin-get-commercial-lifecycle
      summary: List commercial workflows across the 16-state machine
      description: |
        Reads the newest 500 rows from `commercial_workflows` (owned by
        the commercial-lifecycle Worker — §0 forbids a duplicate runtime
        CREATE TABLE; the query fails silent on a cold DB) and rolls
        the §27 16-state machine into a 4-bucket KPI: pipeline (lead →
        contract_drafted), poc (poc_scoped → poc_evidence_delivered),
        live (paid → expansion_in_flight) and renewal (renewal_due).
        Transition signing + the payment-gate machine are resolved by
        the Worker, not this read-only console. Owner-only.
      tags: [CommercialLifecycle]
      x-kye-source-file: public/admin/functions/api/v1/commercial-lifecycle.js
      responses:
        "200":
          description: Workflows + stage-bucket KPI
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  total: { type: integer }
                  kpi:
                    type: object
                    properties:
                      pipeline: { type: integer }
                      poc: { type: integer }
                      live: { type: integer }
                      renewal: { type: integer }
                  workflows:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        sku_id: { type: string }
                        applicant_company: { type: string }
                        tenant_kyeid: { type: string }
                        current_state: { type: string }
                        operator_kyeid: { type: string }
                        entitlement_ends_at: { type: string, format: date-time }
                        created_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Compliance heat-map ───────────────────────────────────────────────────
  /compliance:
    get:
      operationId: admin-get-compliance
      summary: Per-tenant framework-coverage heat-map
      description: |
        Reads tenant-reported rows from `compliance_status`, joins them
        against the locked 8-framework list (NIST AI RMF, EU AI Act,
        ISO 42001, DORA, GDPR, SR 11-7, BCBS 239, PSD2) and rolls
        everything into per-tenant and cross-tenant
        {full, part, none, na, total} coverage maps the UI renders
        directly. Optional `tenant` query filter narrows to one tenant.
        Honest empty state flagged when no rows exist. Owner-only.
      tags: [Compliance]
      x-kye-source-file: public/admin/functions/api/v1/compliance.js
      parameters:
        - { name: tenant, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Coverage roll-up per framework × tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  frameworks:
                    type: array
                    items: { type: string }
                  tenants:
                    type: array
                    items: { type: string }
                  overall:
                    type: object
                    description: Per-framework {full, part, none, na, total} counts
                    additionalProperties:
                      type: object
                      additionalProperties: { type: integer }
                  by_tenant:
                    type: object
                    description: tenant_id → framework → coverage counts
                    additionalProperties: true
                  total_rows: { type: integer }
                  honest_empty_state: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: admin-post-compliance
      summary: Attest a framework capability's coverage for a tenant
      description: |
        Upserts one `compliance_status` row keyed on (tenant_id,
        framework, capability). Coverage must be one of full / part /
        none / na. The attesting operator (Clerk session email) and
        timestamp are stamped on the row; re-attesting the same
        capability replaces the prior coverage value. Used by the
        tenant-side controls surface and ad-hoc admin attestations.
        Owner-only.
      tags: [Compliance]
      x-kye-source-file: public/admin/functions/api/v1/compliance.js
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, framework, capability, coverage]
              properties:
                tenant_id: { type: string, maxLength: 200 }
                framework: { type: string, maxLength: 80 }
                capability: { type: string, maxLength: 200 }
                coverage: { type: string, enum: [full, part, none, na] }
                evidence_ref: { type: string, maxLength: 400 }
      responses:
        "200":
          description: Attestation upserted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  id: { type: string }
                  attested_by: { type: string }
                  attested_at: { type: string, format: date-time }
        "400":
          description: Non-JSON body, missing fields, or bad coverage value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Connector catalog moderation ──────────────────────────────────────────
  /connector-catalog-moderation:
    get:
      operationId: admin-get-connector-catalog-moderation
      summary: List partner connector-kind submissions with moderation KPI
      description: |
        Lists the newest 500 rows from `connector_catalog_submissions`
        (declared canonically here) with optional filters by status
        (pending / under_review / approved / rejected), profile family
        (13 canonical families) and free-text `q` over proposed_kind /
        submitter_email. Returns a KPI block: approved kinds, pending
        queue depth, approvals in the last 90 days (`certified`) and
        rejections in the last 90 days (`bounced`). Owner-only,
        read-only.
      tags: [ConnectorCatalog]
      x-kye-source-file: public/admin/functions/api/v1/connector-catalog-moderation.js
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, under_review, approved, rejected] }
        - name: family
          in: query
          required: false
          schema:
            type: string
            enum: [payments, open_finance, identity, agent_runtime, commerce, compliance_evidence, security_siem, health, insurance, pension, utilities, legal, open_data]
        - { name: q, in: query, required: false, schema: { type: string }, description: "LIKE on proposed_kind / submitter_email" }
      responses:
        "200":
          description: Submissions + moderation KPI
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  count: { type: integer }
                  kpi:
                    type: object
                    properties:
                      kinds: { type: integer }
                      pending: { type: integer }
                      certified: { type: integer }
                      bounced: { type: integer }
                  submissions:
                    type: array
                    items:
                      type: object
                      properties:
                        submission_id: { type: string }
                        proposed_kind: { type: string }
                        profile_family: { type: string }
                        submitter_partner_id: { type: string }
                        submitter_email: { type: string }
                        conformance_score: { type: number }
                        status: { type: string }
                        reviewed_by: { type: string }
                        reviewed_at: { type: string, format: date-time }
                        created_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: admin-post-connector-catalog-moderation
      summary: Register a proposed connector kind for moderation
      description: |
        Inserts a `connector_catalog_submissions` row in `pending`
        status. Requires `proposed_kind` and one of the 13 canonical
        profile families; `conformance_score` is clamped into [0, 1].
        The submission ID is minted as
        `kye:connector-submission:<kind-slug>.<6-char-uuid>` and the
        operator (Clerk session email) is recorded as `created_by`.
        Approved kinds are later promoted into the canonical connector
        schema family. Owner-only.
      tags: [ConnectorCatalog]
      x-kye-source-file: public/admin/functions/api/v1/connector-catalog-moderation.js
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proposed_kind, profile_family]
              properties:
                proposed_kind: { type: string, maxLength: 128 }
                profile_family:
                  type: string
                  enum: [payments, open_finance, identity, agent_runtime, commerce, compliance_evidence, security_siem, health, insurance, pension, utilities, legal, open_data]
                submitter_partner_id: { type: string, maxLength: 128 }
                submitter_email: { type: string, maxLength: 200 }
                conformance_score: { type: number, minimum: 0, maximum: 1 }
                notes: { type: string, maxLength: 4000 }
      responses:
        "201":
          description: Submission registered in pending status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  submission:
                    type: object
                    properties:
                      submission_id: { type: string }
                      proposed_kind: { type: string }
                      profile_family: { type: string }
                      conformance_score: { type: number }
                      status: { type: string, enum: [pending] }
                      created_by: { type: string }
                      created_at: { type: string, format: date-time }
        "400":
          description: Non-JSON body, missing proposed_kind, or invalid profile_family
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Control attestation (CSF 2.0 + ISO 27001) ─────────────────────────────
  /controls:
    get:
      operationId: admin-get-controls
      summary: List the locked control catalog with attestation status
      description: |
        Returns the locked control catalog (`controls` — seeded once
        with the CSF 2.0 + ISO 27001:2022 top-level rows when empty)
        alongside per-tenant `control_attestations` rows, plus a
        `by_control` map grouping attestations by control_id. Optional
        filters: `framework` narrows the catalog, `tenant` narrows the
        attestations. Honest empty state flagged when the catalog is
        empty. Owner-only.
      tags: [Controls]
      x-kye-source-file: public/admin/functions/api/v1/controls.js
      parameters:
        - { name: framework, in: query, required: false, schema: { type: string }, description: "e.g. CSF 2.0 or ISO 27001:2022" }
        - { name: tenant, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Catalog + attestations + by-control roll-up
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  controls:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        framework: { type: string }
                        control_ref: { type: string }
                        title: { type: string }
                        category: { type: string }
                  attestations:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        control_id: { type: string }
                        tenant_id: { type: string }
                        status: { type: string }
                        evidence_ref: { type: string }
                        attested_by: { type: string }
                        attested_at: { type: string, format: date-time }
                        next_review_at: { type: string, format: date-time }
                  by_control:
                    type: object
                    description: control_id → attestation rows
                    additionalProperties: true
                  honest_empty_state: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: admin-post-controls
      summary: Attest a control's implementation status for a tenant
      description: |
        Upserts one `control_attestations` row keyed on (control_id,
        tenant_id). Status must be one of implemented / partial /
        not_implemented / not_applicable; the referenced control must
        exist in the locked catalog (404 otherwise). The attesting
        operator and timestamp are stamped, and `next_review_at` is set
        one year out. Owner-only.
      tags: [Controls]
      x-kye-source-file: public/admin/functions/api/v1/controls.js
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [control_id, tenant_id, status]
              properties:
                control_id: { type: string, maxLength: 200 }
                tenant_id: { type: string, maxLength: 200 }
                status: { type: string, enum: [implemented, partial, not_implemented, not_applicable] }
                evidence_ref: { type: string, maxLength: 400 }
      responses:
        "200":
          description: Attestation upserted with one-year review horizon
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  id: { type: string }
                  attested_by: { type: string }
                  attested_at: { type: string, format: date-time }
                  next_review_at: { type: string, format: date-time }
        "400":
          description: Non-JSON body, missing fields, or bad status value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: control_id not present in the locked catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Directory moderation (§17) ────────────────────────────────────────────
  /directory-moderation:
    get:
      operationId: admin-get-directory-moderation
      summary: List tenant-submitted directory listings awaiting moderation
      description: |
        Lists the newest 200 rows from `directory_submissions` with
        optional filters by listing type (rule_pack / agent / connector /
        assurance_card), tenant_id, status (pending / under_review /
        approved / rejected) and free-text `q` over submission_id /
        title. Returns a KPI block (pending queue depth, approvals and
        rejections in the last 7 days, average hours-to-decision) plus
        the distinct tenant list for the filter dropdown. Owner-only,
        read-only. Constitution §17 Directory Rail.
      tags: [Directory]
      x-kye-source-file: public/admin/functions/api/v1/directory-moderation.js
      parameters:
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [rule_pack, agent, connector, assurance_card] }
        - { name: tenant_id, in: query, required: false, schema: { type: string } }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, under_review, approved, rejected] }
        - { name: q, in: query, required: false, schema: { type: string }, description: "LIKE on submission_id / title" }
      responses:
        "200":
          description: Submissions + moderation KPI + tenant filter values
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  count: { type: integer }
                  kpi:
                    type: object
                    properties:
                      pending: { type: integer }
                      approved_7d: { type: integer }
                      rejected_7d: { type: integer }
                      avg_hours_to_decision: { type: number }
                  tenants:
                    type: array
                    items: { type: string }
                  submissions:
                    type: array
                    items:
                      type: object
                      properties:
                        submission_id: { type: string }
                        tenant_id: { type: string }
                        listing_type: { type: string }
                        title: { type: string }
                        status: { type: string }
                        submitted_at: { type: string, format: date-time }
                        reviewed_at: { type: string, format: date-time }
                        reviewed_by: { type: string }
                        rejection_reason: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: admin-post-directory-moderation
      summary: Approve or reject a directory submission
      description: |
        Decides one `directory_submissions` row: `action` must be
        `approve` or `reject` (reject accepts an optional `reason`,
        ≤ 1000 chars). The UPDATE only matches rows still in `pending`
        or `under_review` — a missing or already-decided submission
        returns 404, making the decision single-shot. The deciding
        operator and timestamp are stamped on the row. Owner-only.
      tags: [Directory]
      x-kye-source-file: public/admin/functions/api/v1/directory-moderation.js
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [submission_id, action]
              properties:
                submission_id: { type: string }
                action: { type: string, enum: [approve, reject] }
                reason: { type: string, maxLength: 1000, description: "Recorded as rejection_reason on reject" }
      responses:
        "200":
          description: Decision applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  submission_id: { type: string }
                  action: { type: string, enum: [approve, reject] }
                  new_status: { type: string, enum: [approved, rejected] }
                  reviewed_by: { type: string }
                  reviewed_at: { type: string, format: date-time }
        "400":
          description: Non-JSON body, missing submission_id, or action not approve/reject
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Submission not found or already decided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── DSAR queue (§31) ──────────────────────────────────────────────────────
  /dsar:
    get:
      operationId: admin-get-dsar
      summary: List Data Subject Access Requests with deadline KPI
      description: |
        Paginated view over `dsar_requests` (owned by the SQL migration
        tree; queries fail silent on a cold DB). `status` filters by
        open / assembly / released, while `overdue` maps to non-released
        rows past their statutory_deadline. Free-text `q` searches
        request_id / controller_id / subject_ref_hash / regime. Returns
        a KPI block (open, assembly, released, overdue) and a pagination
        envelope (`page`, `page_size` ≤ 100, total, total_pages). The
        5-rule assembly pipeline and signing-suite construction are
        patent-track — only observable queue state is exposed.
        Owner-only, read-only. Schema: kye.dsar_evidence_pack.v1.
      tags: [DSAR]
      x-kye-source-file: public/admin/functions/api/v1/dsar.js
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [open, assembly, released, overdue] }
        - { name: q, in: query, required: false, schema: { type: string }, description: "LIKE on request_id / controller_id / subject_ref_hash / regime" }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: DSAR queue page + KPI
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  kpi:
                    type: object
                    properties:
                      open: { type: integer }
                      assembly: { type: integer }
                      released: { type: integer }
                      overdue: { type: integer }
                  pagination:
                    type: object
                    properties:
                      page: { type: integer }
                      page_size: { type: integer }
                      total: { type: integer }
                      total_pages: { type: integer }
                  requests:
                    type: array
                    items:
                      type: object
                      properties:
                        request_id: { type: string }
                        controller_id: { type: string }
                        subject_ref_hash: { type: string }
                        right_requested: { type: string }
                        regime: { type: string }
                        status: { type: string }
                        statutory_deadline: { type: string, format: date-time }
                        captured_at: { type: string, format: date-time }
                        identity_verified_at: { type: string, format: date-time }
                        pack_assembled_at: { type: string, format: date-time }
                        released_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Expert Wall™ moderation queue ─────────────────────────────────────────
  /expert-reviews:
    get:
      operationId: admin-get-expert-reviews
      summary: List the Expert Wall™ moderation queue
      description: |
        Reads the `expert_reviews` table (the same D1 instance the
        public expert-review intake writes to), newest 200 rows. The
        default sort surfaces pending first, then published, then
        rejected; `?status=` narrows to one state. Returns a `queue`
        roll-up counting each status across the full table. Fails silent
        (empty list) on a cold DB. Owner-only, read-only.
      tags: [ExpertReviews]
      x-kye-source-file: public/admin/functions/api/v1/expert-reviews.js
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, published, rejected, all], default: all }
      responses:
        "200":
          description: Moderation view + per-status counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  total: { type: integer }
                  queue:
                    type: object
                    properties:
                      pending: { type: integer }
                      published: { type: integer }
                      rejected: { type: integer }
                  reviews:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        submitted_at: { type: string, format: date-time }
                        name: { type: string }
                        role: { type: string }
                        affiliation: { type: string }
                        artefact: { type: string }
                        review_text: { type: string }
                        verdict: { type: string }
                        status: { type: string }
                        moderated_by: { type: string }
                        moderated_at: { type: string, format: date-time }
                        ip_hash: { type: string }
                        audit_event_id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /expert-reviews/{id}/request-changes:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "expert_reviews.id" }
    post:
      operationId: admin-post-expert-reviews-by-id-request-changes
      summary: Ask the submitter for changes (non-terminal moderation action)
      description: |
        Unlike approve / reject this leaves the row's status as
        `pending` so the submission stays in the moderation queue —
        the `expert_reviews.status` CHECK only allows
        pending / published / rejected. The required moderator `note`
        (≤ 1000 chars) is written to `expert_reviews.moderator_note`
        and durably recorded as an `expert_review_audit` row with
        `action='changes_requested'`. On success the canonical §38
        Comms template `expert-review.changes-requested.v1` is
        dispatched to the submitter in the background (fail-soft —
        email failure never fails the action). Owner-only.
      tags: [ExpertReviews]
      x-kye-source-file: public/admin/functions/api/v1/expert-reviews/[id]/request-changes.js
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, maxLength: 1000, description: "Tells the submitter what to change" }
      responses:
        "200":
          description: Changes requested; row stays pending in the queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  id: { type: string }
                  status: { type: string, enum: [pending] }
                  action: { type: string, enum: [changes_requested] }
                  moderated_by: { type: string }
                  moderated_at: { type: string, format: date-time }
                  note: { type: string }
        "400":
          description: Missing id or empty moderator note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Review not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Onboarding workflow decisions (§22) ───────────────────────────────────
  /onboarding/workflows/{id}/{action}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^kye:onboarding-workflow:" } }
      - { name: action, in: path, required: true, schema: { type: string, enum: [approve, reject] } }
    post:
      operationId: admin-post-onboarding-workflows-by-id-by-action
      summary: Approve or reject an onboarding workflow
      description: |
        Transitions an `onboarding_workflows` row to `approved` or
        `rejected`, recording an `onboarding_transitions` audit row and
        (best-effort) emitting `kye.admin.workflow.{approved,rejected}.v1`
        into the WORM audit chain (§0.3) plus a `workflow.{approved,
        rejected}` message onto KYE_LIFECYCLE_QUEUE so the provisioning
        agent acts on it. Idempotent — a workflow already in the target
        stage returns 200 with `idempotent: true`; a workflow in a
        DIFFERENT terminal stage (approved / rejected / active) returns
        409 so approve-after-reject is impossible. Optional body fields:
        `reason` (≤ 500 chars) and `operator` (also read from the
        x-kye-operator-id header). Owner-only.
      tags: [Onboarding]
      x-kye-source-file: public/admin/functions/api/v1/onboarding/workflows/[id]/[action].js
      x-kye-emits-envelopes: [kye.admin.workflow.approved.v1, kye.admin.workflow.rejected.v1]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
                operator: { type: string, description: "Falls back to the x-kye-operator-id header" }
      responses:
        "200":
          description: Transition applied (or idempotent no-op when already in target stage)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  idempotent: { type: boolean }
                  workflow_id: { type: string }
                  from_stage: { type: string }
                  to_stage: { type: string, enum: [approved, rejected] }
                  current_stage: { type: string }
                  transition_id: { type: string }
                  admin_action_id: { type: string }
                  emitted_at: { type: string, format: date-time }
        "400":
          description: Workflow id not kye:onboarding-workflow:* or action not approve/reject
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Workflow not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Workflow already in a different terminal stage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: D1 write failed mid-transition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /pilot-applications/{id}/send-sign-in:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "audit_pilot_applications.id" }
    post:
      operationId: admin-post-pilot-applications-by-id-send-sign-in
      summary: Email a one-click Clerk sign-in link to a granted pilot applicant
      description: |
        Step 2 of the grant flow. Looks up the applicant's email on
        `audit_pilot_applications`, finds or creates the Clerk user
        (passwordless, role=operator), mints a 24-hour Clerk
        sign_in_token and dispatches the canonical §38 Comms template
        `admin.send-sign-in.v1` carrying the one-click dashboard URL.
        An audit row lands in `pilot_application_signin_invites` storing
        only the token's SHA-256 — the URL itself is never persisted
        (single-use; leaked-in-transit risk only). Dual-channel admin
        (§27 §4): the email-action channel converges on the same
        handler logic. Requires the CLERK_SECRET_KEY env var and the
        MAIL service binding; returns 503 when either is absent and 502
        when the mail dispatch fails. Owner-only.
      tags: [PilotApplications]
      x-kye-source-file: public/admin/functions/api/v1/pilot-applications/[id]/send-sign-in.js
      responses:
        "200":
          description: Invite emailed; audit row written with token hash only
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  application_id: { type: string }
                  recipient_email: { type: string }
                  clerk_user_id: { type: string }
                  expires_at: { type: string, format: date-time }
                  token_sha256: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Application not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Application has no email address on file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: Mail dispatch via the §38 Comms Engine failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: KYE_DB, CLERK_SECRET_KEY or MAIL binding missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Reporting Engine™ surface (§14) ───────────────────────────────────────
  /reports:
    get:
      operationId: admin-get-reports
      summary: List sealed compliance reports for the caller's tenant
      description: |
        Returns the tenant's sealed `kye.report.v1` envelopes, most recently
        sealed first (capped at 200), alongside two derived counters: how many
        were sealed since the start of the current calendar quarter, and how
        many distinct frameworks they cover. Tenant-scoped via the Clerk
        session; owner-gated by the middleware.

        Read-only by construction. Sealing a report requires the Ed25519
        signing seed and the immutable report bucket, and this surface holds
        neither binding — reports are sealed by the KYE Reporting Engine™ and
        merely read here. There is deliberately no POST: the one that used to
        stand here omitted three NOT NULL seal columns and wrote a
        `headline_verdict` the table's CHECK constraint rejects, so it could
        never write a row while reporting success to the operator.

        An empty `rows` array means this tenant has no sealed reports, not that
        the query failed; the SELECTs return `[]` rather than throwing on a
        cold database.
      tags: [Reports]
      x-kye-source-file: public/admin/functions/api/v1/reports.js
      responses:
        "200":
          description: Sealed reports for the caller's tenant
          content:
            application/json:
              schema:
                type: object
                required: [ok, tenant_id, rows, count_this_quarter, frameworks_covered]
                properties:
                  ok: { type: boolean, enum: [true] }
                  tenant_id: { type: string }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        report_id: { type: string }
                        report_kind: { type: string }
                        framework: { type: string }
                        period_start: { type: string, format: date }
                        period_end: { type: string, format: date }
                        headline_verdict:
                          type: string
                          enum: [conformant, qualified, non_conformant, in_progress]
                        finding_count: { type: integer }
                        controls_pass: { type: integer }
                        controls_fail: { type: integer }
                        controls_exception: { type: integer }
                        sealed_at: { type: string, format: date-time }
                        assembler_kid: { type: string }
                  count_this_quarter: { type: integer }
                  frameworks_covered: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: KYE_DB binding missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Risk-assessment audit view ────────────────────────────────────────────
  /risk-audit:
    get:
      operationId: admin-get-risk-audit
      summary: Cross-tenant risk-assessment audit list
      description: |
        Lists the newest 500 rows from `risk_assessments` (owned by the
        SQL migration tree; created by the runtime engine, never by this
        console) with optional filters by tenant_id, risk tier (minimal /
        limited / high / unacceptable / prohibited), subject class,
        framework slug and free-text `q` over assessment_id / subject_id.
        Returns a 7-day KPI strip — prohibited and unacceptable verdicts,
        EU AI Act high+ floors, and DORA critical-or-important floors —
        plus the distinct tenant list for the filter dropdown. Owner-only,
        read-only.
      tags: [RiskAudit]
      x-kye-source-file: public/admin/functions/api/v1/risk-audit.js
      parameters:
        - { name: tenant_id, in: query, required: false, schema: { type: string } }
        - name: tier
          in: query
          required: false
          schema: { type: string, enum: [minimal, limited, high, unacceptable, prohibited] }
        - name: subject_class
          in: query
          required: false
          schema: { type: string, enum: [decision, agent, capability, scenario, operating_model, deal, rule_pack, connector] }
        - name: framework
          in: query
          required: false
          schema: { type: string, enum: [eu_ai_act, dora, gdpr, nist_ai_rmf, iso_42001, fca_opres, pci_dss, sox] }
        - { name: q, in: query, required: false, schema: { type: string }, description: "LIKE on assessment_id / subject_id" }
      responses:
        "200":
          description: Risk assessments + 7-day KPI
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  total: { type: integer }
                  kpi:
                    type: object
                    properties:
                      prohibited_7d: { type: integer }
                      unacceptable_7d: { type: integer }
                      eu_ai_act_floors_7d: { type: integer }
                      dora_floors_7d: { type: integer }
                  tenants:
                    type: array
                    items: { type: string }
                  risk_assessments:
                    type: array
                    items:
                      type: object
                      properties:
                        assessment_id: { type: string }
                        tenant_id: { type: string }
                        subject_id: { type: string }
                        subject_class: { type: string }
                        risk_tier: { type: string }
                        score: { type: number }
                        eu_ai_act_floor: { type: string }
                        dora_floor: { type: string }
                        framework: { type: string }
                        effective_at: { type: string, format: date-time }
                        created_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Scopes catalog (§12 Purpose Permission™) ──────────────────────────────
  /scopes-catalog:
    get:
      operationId: admin-get-scopes-catalog
      summary: List canonical scope entries with pin status
      description: |
        Lists `scopes_catalog` rows (pinned first, then newest) with
        optional filters by capability, jurisdiction and pinned state.
        Returns a KPI block — distinct scope count, pinned count, total
        tenant reuse (sum of tenant_count) and distinct jurisdiction
        count — plus the distinct capability list for the filter
        dropdown. Owner-only, read-only. Constitution §12 (scope
        triples) + §0 (single canonical per concept).
      tags: [ScopesCatalog]
      x-kye-source-file: public/admin/functions/api/v1/scopes-catalog.js
      parameters:
        - { name: capability, in: query, required: false, schema: { type: string } }
        - { name: jurisdiction, in: query, required: false, schema: { type: string } }
        - { name: pinned, in: query, required: false, schema: { type: string, enum: ["true", "false"] } }
      responses:
        "200":
          description: Scope entries + KPI + capability filter values
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  count: { type: integer }
                  kpi:
                    type: object
                    properties:
                      distinct: { type: integer }
                      pinned: { type: integer }
                      tenants: { type: integer }
                      juris: { type: integer }
                  capabilities:
                    type: array
                    items: { type: string }
                  scopes:
                    type: array
                    items:
                      type: object
                      properties:
                        scope_id: { type: string }
                        capability: { type: string }
                        datasets_json: { type: string }
                        jurisdiction: { type: string }
                        tenant_count: { type: integer }
                        pinned: { type: integer }
                        pinned_by: { type: string }
                        pinned_at: { type: string, format: date-time }
                        created_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: admin-post-scopes-catalog
      summary: Pin, unpin or create a canonical scope entry
      description: |
        Multiplexed by the `op` body field (default `pin`). `pin` /
        `unpin` toggle the pinned flag on an existing scope (404 when
        the scope_id is unknown), stamping the pinning operator and
        timestamp. `create` inserts a new scope with capability +
        optional jurisdiction (default GB) and dataset list; IDs not
        already in `kye:scope:*` form are minted as
        `kye:scope:<capability-slug>.<jurisdiction>.<6-char-uuid>`.
        Any other `op` returns 400 with the valid list. Owner-only.
      tags: [ScopesCatalog]
      x-kye-source-file: public/admin/functions/api/v1/scopes-catalog.js
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope_id]
              properties:
                op: { type: string, enum: [pin, unpin, create], default: pin }
                scope_id: { type: string }
                capability: { type: string, description: "Required when op=create" }
                jurisdiction: { type: string, maxLength: 8, default: GB }
                datasets:
                  type: array
                  items: { type: string }
                  description: op=create only
      responses:
        "200":
          description: Pin state toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  scope_id: { type: string }
                  pinned: { type: boolean }
        "201":
          description: Scope created (op=create)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  scope:
                    type: object
                    properties:
                      scope_id: { type: string }
                      capability: { type: string }
                      datasets_json: { type: string }
                      jurisdiction: { type: string }
                      tenant_count: { type: integer }
                      pinned: { type: boolean }
                      created_at: { type: string, format: date-time }
        "400":
          description: Non-JSON body, missing scope_id/capability, or unknown op
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: scope_id not found (pin / unpin)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Support tickets (§8 §3) ───────────────────────────────────────────────
  /support:
    get:
      operationId: admin-get-support
      summary: List support tickets with status counts
      description: |
        Lists the newest 500 `support_tickets` rows (open tickets first)
        with optional exact-match filters by `status` and `tenant`.
        Returns a `counts` roll-up (open / in_progress / closed) across
        the full table and flags the honest empty state. Owner-only,
        read-only. Constitution §8 §3 (support tooling).
      tags: [Support]
      x-kye-source-file: public/admin/functions/api/v1/support.js
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [open, in_progress, closed] } }
        - { name: tenant, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Tickets + status counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  tickets:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        tenant_id: { type: string }
                        title: { type: string }
                        body: { type: string }
                        severity: { type: string }
                        status: { type: string }
                        owner: { type: string }
                        opened_by: { type: string }
                        opened_at: { type: string, format: date-time }
                        claimed_at: { type: string, format: date-time }
                        closed_at: { type: string, format: date-time }
                        resolution: { type: string }
                  counts:
                    type: object
                    properties:
                      open: { type: integer }
                      in_progress: { type: integer }
                      closed: { type: integer }
                  honest_empty_state: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: admin-post-support
      summary: Open a support ticket for a tenant
      description: |
        Inserts a `support_tickets` row in `open` status. Requires
        tenant_id and title; severity must be one of P0–P3 (default P3).
        The opening operator (Clerk session email) is recorded as
        `opened_by` and the ticket ID is minted as
        `kye:support:<uuid>`. Owner-only.
      tags: [Support]
      x-kye-source-file: public/admin/functions/api/v1/support.js
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, title]
              properties:
                tenant_id: { type: string, maxLength: 200 }
                title: { type: string, maxLength: 200 }
                body: { type: string, maxLength: 8000 }
                severity: { type: string, enum: [P0, P1, P2, P3], default: P3 }
      responses:
        "201":
          description: Ticket opened
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  ticket:
                    type: object
                    properties:
                      id: { type: string }
                      tenant_id: { type: string }
                      title: { type: string }
                      severity: { type: string }
                      status: { type: string, enum: [open] }
                      opened_by: { type: string }
                      opened_at: { type: string, format: date-time }
        "400":
          description: Non-JSON body, missing tenant_id/title, or bad severity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /support/{id}/claim:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "support_tickets.id" }
    post:
      operationId: admin-post-support-by-id-claim
      summary: Claim a support ticket for the calling operator
      description: |
        Assigns the ticket to the caller (Clerk session email) and moves
        it to `in_progress`, stamping `claimed_at`. Idempotent for the
        same operator; a different operator re-claiming replaces the
        owner with a fresh claimed_at. Claiming a closed ticket returns
        409. Owner-only. No request body.
      tags: [Support]
      x-kye-source-file: public/admin/functions/api/v1/support/[id]/claim.js
      responses:
        "200":
          description: Ticket claimed and moved to in_progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  id: { type: string }
                  owner: { type: string }
                  status: { type: string, enum: [in_progress] }
                  claimed_at: { type: string, format: date-time }
        "400":
          description: Missing ticket id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Ticket not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Ticket already closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /support/{id}/close:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "support_tickets.id" }
    post:
      operationId: admin-post-support-by-id-close
      summary: Close a support ticket with a resolution note
      description: |
        Moves the ticket to `closed`, recording the required
        `resolution` (4–4000 chars) and `closed_at`. If the ticket was
        never claimed, the closing operator becomes the owner
        (COALESCE). Owner-only.
      tags: [Support]
      x-kye-source-file: public/admin/functions/api/v1/support/[id]/close.js
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution: { type: string, minLength: 4, maxLength: 4000 }
      responses:
        "200":
          description: Ticket closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  id: { type: string }
                  status: { type: string, enum: [closed] }
                  closed_at: { type: string, format: date-time }
                  resolution: { type: string }
        "400":
          description: Missing ticket id or resolution under 4 chars
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Ticket not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Transparency log ──────────────────────────────────────────────────────
  /transparency:
    get:
      operationId: admin-get-transparency
      summary: Hash-chain rollup of the transparency log
      description: |
        Reads the `transparency_log` table (declared in migration
        040_operating_models_and_transparency_log.sql — no runtime DDL,
        §16) newest-first with optional filters by tenant and entry
        kind and a `limit` capped at 500. Returns the chain head
        (latest seq + chain_hash), a per-kind tally, the total entry
        count and the honest empty-state flag. The log is populated by
        the self-audit daemon, the transparency-log appender and every
        agent that emits a signed artefact. Owner-only, read-only.
      tags: [Transparency]
      x-kye-source-file: public/admin/functions/api/v1/transparency.js
      parameters:
        - { name: tenant, in: query, required: false, schema: { type: string } }
        - { name: kind, in: query, required: false, schema: { type: string }, description: "entry_kind, e.g. self_audit_run or audit_batch" }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 200, maximum: 500 } }
      responses:
        "200":
          description: Chain head + per-kind tally + entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  head: { type: object, description: "Chain head (latest entry)", properties: { seq: { type: integer }, chain_hash: { type: string }, emitted_at: { type: string, format: date-time } } }
                  total: { type: integer }
                  by_kind:
                    type: array
                    items:
                      type: object
                      properties:
                        entry_kind: { type: string }
                        n: { type: integer }
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        seq: { type: integer }
                        entry_kind: { type: string }
                        entry_ref: { type: string }
                        entry_hash: { type: string }
                        prev_hash: { type: string }
                        chain_hash: { type: string }
                        emitted_at: { type: string, format: date-time }
                        tenant_id: { type: string }
                  honest_empty_state: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: admin-post-transparency
      summary: Verify the transparency chain via the private verifier worker
      description: |
        Accepts `{ "op": "verify" }` only (any other op returns 400) and
        proxies the request to the private transparency-verifier worker
        bound as TRANSPARENCY_VERIFIER — the chain-reconstruction and
        integrity rules are patent-track, so this surface relays the
        verifier's response verbatim (status code included). When the
        binding is absent the endpoint returns 501 explaining how to
        enable it; an unreachable verifier returns 503. Owner-only.
      tags: [Transparency]
      x-kye-source-file: public/admin/functions/api/v1/transparency.js
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [op]
              properties:
                op: { type: string, enum: [verify] }
      responses:
        "200":
          description: Verifier response relayed verbatim (shape owned by the private worker)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: op missing or not "verify"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501":
          description: TRANSPARENCY_VERIFIER service binding not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: KYE_DB missing or verifier unreachable
