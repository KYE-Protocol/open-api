  # ─────────────────────────────────────────────────────────────────────────
  # Hand-authored Top-30 (2026-05-28) — priority ordering: auth/authorization
  # first, then audit + evidence, then lifecycle approval queues, then
  # operator emergency actions, then settings registries. Each operation is
  # grounded in the actual Pages-Functions handler at the cited path.
  # ─────────────────────────────────────────────────────────────────────────

  # ── Signing Keys ──────────────────────────────────────────────────────────
  /keys:
    get:
      operationId: admin-list-signing-keys
      summary: List every signing key (active, rotating, revoked, retired)
      description: |
        Returns the contents of the `signing_keys` D1 table — every Ed25519 /
        ECDSA / RSA signing key registered across all tenants, sorted by
        status (active → rotating → retired → revoked) then created_at DESC.
        The response also enumerates which custody providers are writable
        (`in-process`) vs read-only (`aws-kms`, `gcp-kms`, `azure-kv`, `pkcs11`).
        Owner-only; does not emit a §0.3 envelope (read-only inventory call).
      tags: [SigningKeys]
      x-kye-source-file: public/admin/functions/api/v1/keys.js
      responses:
        "200":
          description: Inventory of signing keys + custody-provider matrix
          content:
            application/json:
              schema:
                type: object
                required: [ok, keys, providers_writable, providers_read_only]
                properties:
                  ok: { type: boolean, enum: [true] }
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        kid: { type: string, example: "kye-evidence-signing-2026-aF7g3kLm9nQ4xC2v" }
                        alg: { type: string, enum: [EdDSA, ES256, ES384, RS256] }
                        purpose: { type: string, example: "evidence-signing" }
                        custody_provider: { type: string, enum: [in-process, aws-kms, gcp-kms, azure-kv, pkcs11] }
                        custody_ref: { type: string, example: "arn:aws:kms:eu-west-1:111122223333:key/abcd-1234" }
                        status: { type: string, enum: [active, rotating, revoked, retired] }
                        created_at: { type: string, format: date-time }
                        rotated_at: { type: string, format: date-time }
                        revoked_at: { type: string, format: date-time }
                        created_by: { type: string }
                        notes: { type: string }
                  providers_writable:
                    type: array
                    items: { type: string }
                    example: [in-process]
                  providers_read_only:
                    type: array
                    items: { type: string }
                    example: [aws-kms, gcp-kms, azure-kv, pkcs11]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500":
          description: Internal error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: KYE_DB binding missing on this deploy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: admin-create-signing-key
      summary: Generate a new in-process signing key
      description: |
        Generates a new asymmetric signing key in Workers crypto (ECDSA
        P-256 for `EdDSA`/`ES256`, P-384 for `ES384`, RSASSA-PKCS1 2048 for
        `RS256`) and inserts a row into `signing_keys` with status=active.
        The kid is derived from the JWK thumbprint (RFC 7638-style) prefixed
        with the purpose slug and current year. Externally-managed providers
        (`aws-kms`, `gcp-kms`, `azure-kv`, `pkcs11`) are read-only here and
        return 409 — those keys must be rotated via the KMS runbook.
        Owner-only; the operator's email is recorded as `created_by`.
      tags: [SigningKeys]
      x-kye-source-file: public/admin/functions/api/v1/keys.js
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alg:
                  type: string
                  enum: [EdDSA, ES256, ES384, RS256]
                  default: ES256
                  description: JWA algorithm identifier
                purpose:
                  type: string
                  maxLength: 64
                  example: evidence-signing
                  description: Free-form purpose slug recorded on the key
                custody_provider:
                  type: string
                  enum: [in-process, aws-kms, gcp-kms, azure-kv, pkcs11]
                  default: in-process
                notes:
                  type: string
                  maxLength: 4000
            examples:
              evidence-signing:
                summary: New ES256 evidence-signing key
                value: { alg: ES256, purpose: evidence-signing, notes: "Quarterly key roll 2026-Q2" }
      responses:
        "201":
          description: Key generated; public JWK returned. Private material stays encrypted at rest.
          content:
            application/json:
              schema:
                type: object
                required: [ok, key]
                properties:
                  ok: { type: boolean, enum: [true] }
                  key:
                    type: object
                    properties:
                      kid: { type: string }
                      alg: { type: string }
                      purpose: { type: string }
                      custody_provider: { type: string, enum: [in-process] }
                      status: { type: string, enum: [active] }
                      created_at: { type: string, format: date-time }
                      created_by: { type: string }
                      public_jwk: { type: object, additionalProperties: true }
        "400":
          description: Invalid body, unknown alg, or unknown custody_provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Provider is read-only (managed externally) or kid collision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Key generation failed in Workers crypto.subtle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: admin-revoke-signing-key
      summary: Mark a signing key revoked (soft-delete)
      description: |
        Soft-deletes a signing key by setting status='revoked' and
        revoked_at=now. The row stays — historical audit-JWS payloads
        signed by this kid must still resolve for replay. Idempotent
        on already-revoked keys (returns 404 `not_found_or_already_revoked`).
        Owner-only; reversibility is none (rotation, not un-revocation, is
        the recovery path).
      tags: [SigningKeys]
      x-kye-source-file: public/admin/functions/api/v1/keys.js
      parameters:
        - name: kid
          in: query
          required: true
          schema: { type: string, example: "kye-evidence-signing-2026-aF7g3kLm9nQ4xC2v" }
          description: Key identifier (JWK thumbprint suffix) to revoke
      responses:
        "200":
          description: Key marked revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  kid: { type: string }
                  status: { type: string, enum: [revoked] }
                  revoked_at: { type: string, format: date-time }
        "400":
          description: Missing `kid` query parameter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Kid not found or already revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Key Rotation ──────────────────────────────────────────────────────────
  /key-rotation:
    get:
      operationId: admin-list-key-rotations
      summary: List signing keys with rotation status + pending rotation queue
      description: |
        Returns signing keys (optionally scoped by `?scope=`) joined with
        rotation lifecycle columns (created_at, activated_at, rotation_due_at,
        retired_at) plus the queue of pending or in-progress rotations from
        `key_rotations`. The summary block reports active count, rotations
        due within 30 days, and overdue rotations. Owner-only; surfaces the
        canonical KMS lifecycle defined in `internal`.
      tags: [SigningKeys]
      x-kye-source-file: public/admin/functions/api/v1/key-rotation.js
      parameters:
        - name: scope
          in: query
          required: false
          schema: { type: string, example: "platform" }
          description: Optional scope filter (e.g. `platform`, `tenant:<id>`)
      responses:
        "200":
          description: Keys + pending rotations + summary counters
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  keys: { type: array, items: { type: object } }
                  pending_rotations: { type: array, items: { type: object } }
                  summary:
                    type: object
                    properties:
                      active: { type: integer }
                      due_30d: { type: integer }
                      overdue: { type: integer }
                      total: { type: integer }
                  honest_empty_state: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: KYE_DB binding missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: admin-trigger-key-rotation
      summary: Manually enqueue a signing-key rotation
      description: |
        Inserts a `queued` row into `key_rotations` and (best-effort) sends
        a message onto the `KEY_ROTATION_OUT` queue for the
        kye-key-rotation-orchestrator agent to consume. The `compromise:true`
        flag marks this as a compromise rotation (otherwise `scheduled`).
        The orchestrator performs the actual key release ceremony per §51
        multi-sig runbook. Owner-only; emits the §0.3 evidence chain when
        the orchestrator processes the rotation (not at queue time).
      tags: [SigningKeys]
      x-kye-source-file: public/admin/functions/api/v1/key-rotation.js
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key_id, reason]
              properties:
                key_id: { type: string, maxLength: 200, example: "kye:signing-key:platform.2026-q1" }
                reason: { type: string, minLength: 4, maxLength: 1000, example: "Quarterly rotation per §51 closure runbook" }
                compromise: { type: boolean, default: false, description: "True → mark rotation kind=compromise" }
            examples:
              scheduled:
                summary: Scheduled quarterly rotation
                value: { key_id: "kye:signing-key:platform.2026-q1", reason: "Quarterly rotation per §51 closure runbook" }
              compromise:
                summary: Compromise rotation
                value: { key_id: "kye:signing-key:platform.2026-q1", reason: "Audit detected potential key exposure in vendor incident #IR-7421", compromise: true }
      responses:
        "202":
          description: Rotation queued for the orchestrator
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  rotation_id: { type: string }
                  status: { type: string, enum: [queued] }
                  kind: { type: string, enum: [scheduled, compromise] }
                  requested_by: { type: string }
                  requested_at: { type: string, format: date-time }
        "400":
          description: Missing key_id or reason below 4-char minimum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: key_id not found in signing_keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Key is already retired — rotation cannot be queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Authority Grants & Issuers ────────────────────────────────────────────
  /authorities:
    get:
      operationId: admin-list-authority-grants
      summary: List authority grants across all tenants
      description: |
        Reads the `authority_grants` D1 table — every capability / purpose /
        scope / data_use grant issued under §12 Purpose Permission™ + §13
        Resilience Loop™ + §25 Edge Governance™. Supports filtering by
        tenant_id, grant class, status, and free-text on id/subject/issuer.
        Returns a KPI block (active / pending / expired_30d / revoked_30d)
        alongside the row list capped at 500. Owner-only, read-only.
      tags: [Authorities]
      x-kye-source-file: public/admin/functions/api/v1/authorities.js
      parameters:
        - { name: tenant_id, in: query, required: false, schema: { type: string }, description: "Filter to one tenant" }
        - name: class
          in: query
          required: false
          schema: { type: string, enum: [capability, purpose, scope, data_use] }
          description: Grant class filter
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, pending, expired, revoked] }
        - { name: q, in: query, required: false, schema: { type: string }, description: "LIKE match against id / subject / issuer" }
      responses:
        "200":
          description: Grants + KPI rollup
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  count: { type: integer }
                  kpi:
                    type: object
                    properties:
                      active: { type: integer }
                      pending: { type: integer }
                      expired_30d: { type: integer }
                      revoked_30d: { type: integer }
                  grants: { type: array, items: { type: object } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: KYE_DB binding missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Ingest (citation-namespace intake) ─────────────────────────────────────
  /ingest:
    get:
      operationId: admin-list-ingest-submissions
      summary: The citation-namespace intake queue, newest first
      description: |
        Lists the 100 most recent `kye.ingest_submission.v1` rows from both
        intake channels — the console and ingest@kyeprotocol.com — with their
        lifecycle state: received, queued, acquired, or refused.

        A row is a REQUEST to acquire a source, never a source. `state` is the
        only honest summary: `acquired` (and only `acquired`) carries a
        `resolved_source_id`, and that field's presence is the proof the
        submission went through the canonical acquire path rather than around
        it. `refused` retains its `refusal_reason` deliberately — a discarded
        refusal invites the same bad source to be resubmitted next month.

        Owner-only, read-only. Returns an empty list on a cold DB rather than
        failing.
      tags: [Ingest]
      x-kye-source-file: public/admin/functions/api/v1/ingest.js
      responses:
        "200":
          description: Submissions, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  submissions:
                    type: array
                    items:
                      type: object
                      properties:
                        submission_id: { type: string, pattern: "^kye:ingest:[a-z0-9][a-z0-9-]*$" }
                        channel: { type: string, enum: [url, upload, email-attachment] }
                        state: { type: string, enum: [received, queued, acquired, refused] }
                        submitted_by: { type: string }
                        url: { type: [string, "null"] }
                        filename: { type: [string, "null"] }
                        received_at: { type: string, format: date-time }
                        resolved_source_id: { type: [string, "null"] }
                        refusal_reason: { type: [string, "null"] }
                  note: { type: string, description: "Present only when no database binding exists on the environment" }
        "401": { description: Unauthenticated }
    post:
      operationId: admin-create-ingest-submission
      summary: Queue a URL or document for acquisition
      description: |
        Accepts a URL (`application/json`) or a file (`multipart/form-data`)
        and records a `kye.ingest_submission.v1`. It does NOT fetch, hash, or
        verify anything, and it never writes kye:registry:research-sources.

        That restraint is the design. "Verified" means one specific thing — the
        URL was retrieved, the bytes hashed, and the sentence being quoted is
        genuinely on the page that came back — and it is implemented once, in
        the canonical acquire path. A second implementation here would drift
        from the first and both would keep writing `verified`.

        URLs must be https and are refused for private/loopback hosts. Uploads
        are hashed at intake, so the bytes acquisition later reads can be shown
        to be the bytes that arrived. Owner-only.
      tags: [Ingest]
      x-kye-source-file: public/admin/functions/api/v1/ingest.js
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, description: "https only; private and loopback hosts are refused" }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "25 MB maximum" }
      responses:
        "202":
          description: Queued for acquisition — NOT yet a citable source
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: boolean }
                  submission_id: { type: string }
                  state: { type: string, enum: [queued] }
                  what_this_means:
                    type: string
                    description: |
                      States plainly that nothing has been fetched or checked and that
                      acquisition may still refuse it. The wording is part of the
                      contract: "queued" and "verified" are one step apart in the
                      pipeline and a world apart in what they license.
        "400": { description: "url_required, url_rejected, or malformed_request" }
        "401": { description: Unauthenticated }
        "413": { description: file_too_large }
        "415": { description: unsupported_content_type }
        "500": { description: intake_failed }
  /issuers:
    get:
      operationId: admin-list-authority-issuers
      summary: List registered authority issuers
      description: |
        Returns rows from `authority_issuers` — the registry of root /
        delegated / KYE-trust-anchor / partner-anchor signing identities.
        Every issuer is keyed by an Ed25519 (or other) kid registered in
        the `signing_keys` table; this endpoint surfaces the binding plus
        active_grants counters. Supports filter by class, status, tenant,
        and free-text `q` (LIKE on urn / kid / display_name). Owner-only.
      tags: [Authorities]
      x-kye-source-file: public/admin/functions/api/v1/issuers.js
      parameters:
        - name: class
          in: query
          required: false
          schema: { type: string, enum: [root_principal, delegated_principal, kye_trust_anchor, partner_anchor] }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, suspended, revoked] }
        - { name: tenant_id, in: query, required: false, schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string }, description: "LIKE match on issuer_urn / signing_kid / display_name" }
      responses:
        "200":
          description: Issuers + distinct tenant list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  count: { type: integer }
                  tenants: { type: array, items: { type: string } }
                  issuers: { type: array, items: { type: object } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: admin-register-authority-issuer
      summary: Register a new authority issuer
      description: |
        Inserts a new row into `authority_issuers` binding an issuer URN
        (must start with `kye:issuer:`) to a signing kid from the keys
        registry. Issuer class must be one of root_principal,
        delegated_principal, kye_trust_anchor, or partner_anchor. Status
        is set to `active`; the registering operator is recorded as
        `registered_by`. Reversibility: status can be moved to suspended
        / revoked via a separate PATCH (not declared yet); no DELETE.
      tags: [Authorities]
      x-kye-source-file: public/admin/functions/api/v1/issuers.js
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuer_urn, issuer_class, signing_kid, display_name]
              properties:
                issuer_urn:
                  type: string
                  pattern: "^kye:issuer:"
                  example: "kye:issuer:platform.root.2026"
                issuer_class:
                  type: string
                  enum: [root_principal, delegated_principal, kye_trust_anchor, partner_anchor]
                signing_kid:
                  type: string
                  maxLength: 200
                  example: "kye-evidence-signing-2026-aF7g3kLm9nQ4xC2v"
                display_name:
                  type: string
                  maxLength: 200
                tenant_id:
                  type: string
                  description: Optional — null for platform-level issuers
                notes:
                  type: string
            examples:
              kye-trust-anchor:
                value:
                  issuer_urn: "kye:issuer:platform.trust-anchor.2026"
                  issuer_class: kye_trust_anchor
                  signing_kid: "kye-trust-anchor-2026-Hv4nM2pL9qR1xK7w"
                  display_name: "KYE Platform Trust Anchor 2026"
      responses:
        "201":
          description: Issuer registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  issuer: { type: object }
        "400":
          description: Bad URN prefix, invalid class, missing kid / display_name, or invalid JSON
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Revocations ───────────────────────────────────────────────────────────
  /revocations:
    get:
      operationId: admin-list-revocations
      summary: List authority-grant revocations + cascade status
      description: |
        Reads the `revocations` D1 table — every authority-grant revocation
        with its cascade lifecycle status (complete / pending / failed) and
        downstream-cancelled counter. Supports filters by cascade_status,
        reason, initiator, and free-text on revocation_id / grant_id. KPI
        block reports today's count + cascade rollup. Backs the
        revocations.html admin page. Owner-only, read-only.
      tags: [Revocations]
      x-kye-source-file: public/admin/functions/api/v1/revocations.js
      parameters:
        - name: cascade_status
          in: query
          required: false
          schema: { type: string, enum: [complete, pending, failed] }
        - name: reason
          in: query
          required: false
          schema:
            type: string
            enum: [compromise_suspected, policy_change, tenant_offboarding, delegation_expired, operating_model_amendment]
        - name: initiator
          in: query
          required: false
          schema: { type: string, enum: [tenant_admin, kye_owner, incident_response] }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: Revocations + KPI rollup
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  total: { type: integer }
                  kpi:
                    type: object
                    properties:
                      today: { type: integer }
                      cascade_ok: { type: integer }
                      cascade_pending: { type: integer }
                      cascade_failed: { type: integer }
                  revocations: { type: array, items: { type: object } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: admin-create-revocation
      summary: Initiate an authority-grant revocation
      description: |
        Inserts a new row into `revocations` with cascade_status='pending'.
        The cascade orchestrator picks the row up out-of-band and walks
        downstream credentials, sealing cascade_status when complete. Reason
        must be one of the five canonical reasons; initiator defaults to
        `kye_owner` when omitted. Emits to the §0.3 audit chain when the
        cascade orchestrator runs (not at insert time). Reversibility:
        none — revocations are append-only.
      tags: [Revocations]
      x-kye-source-file: public/admin/functions/api/v1/revocations.js
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_id, reason]
              properties:
                grant_id: { type: string, maxLength: 500 }
                reason:
                  type: string
                  enum: [compromise_suspected, policy_change, tenant_offboarding, delegation_expired, operating_model_amendment]
                initiator:
                  type: string
                  enum: [tenant_admin, kye_owner, incident_response]
                  default: kye_owner
                tenant_id: { type: string, maxLength: 300, default: "kye:tenant:platform" }
                notes: { type: string, maxLength: 2000 }
            examples:
              compromise:
                value:
                  grant_id: "kye:authority-grant:capability.acme.42"
                  reason: compromise_suspected
                  initiator: incident_response
                  tenant_id: "kye:tenant:acme"
                  notes: "Vendor breach disclosure 2026-05-28"
      responses:
        "201":
          description: Revocation initiated; cascade is pending
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  revocation: { type: object }
        "400":
          description: Missing grant_id, invalid reason, or invalid JSON
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Tenant emergency revocation ───────────────────────────────────────────
  /tenants/{id}/revoke:
    post:
      operationId: admin-revoke-tenant
      summary: Force-revoke a tenant (operator emergency action)
      description: |
        Sets tenants.status='revoked' + revoked_at/by/reason atomically with
        an `audit_events` insert (event_type `kye.admin.tenant.revoked.v1`),
        then best-effort enqueues a `kye.lifecycle.compensating.v1` message
        onto KYE_LIFECYCLE_QUEUE so billing + evidence-archiver consumers
        react. This is the dual-channel admin endpoint; the canonical
        email-action token URL at `/email-action` dispatches to the same
        logic — single-use is enforced by the email_action_token_used
        UNIQUE constraint + this handler's idempotent revoked-state check.
        Idempotent: revoking an already-revoked tenant returns 200 with
        `idempotent: true`. Reversibility: none (re-provisioning is a
        new pilot grant, not an un-revoke).
      tags: [Tenants]
      x-kye-source-file: public/admin/functions/api/v1/tenants/[id]/revoke.js
      x-kye-emits-envelopes: [kye.admin.tenant.revoked.v1, kye.lifecycle.compensating.v1]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: "kye:tenant:acme" }, description: "Tenant ID to revoke" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  enum: [customer_requested, non_payment, compliance_breach, fraud, operator_action, tenant_lifecycle_end]
                  default: operator_action
                note: { type: string, maxLength: 500 }
            examples:
              non-payment:
                value: { reason: non_payment, note: "Stripe subscription 60 days past due; collections escalated" }
              compliance:
                value: { reason: compliance_breach, note: "Audit finding 2026-05-15: cross-tenant data leak in widget embed" }
      responses:
        "200":
          description: Tenant revoked (or already-revoked idempotent return)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  idempotent: { type: boolean }
                  tenant_id: { type: string }
                  status: { type: string, enum: [revoked] }
                  revoked_at: { type: string, format: date-time }
                  revoked_by: { type: string }
                  revoke_reason: { type: string }
                  audit_event_id: { type: string }
        "400":
          description: Invalid JSON or unrecognised reason
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Tenant ID not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Conflicting concurrent modification (state changed mid-request)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "412":
          description: Second approver missing for dual-channel revocation (when configured)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Audit Chain (read-only) ───────────────────────────────────────────────
  /audit-chain:
    get:
      operationId: admin-list-audit-chain
      summary: Read the last N hash-chained audit events
      description: |
        Returns the most recent rows from `audit_events` (default 100, max
        500) for client-side hash-chain integrity verification — the
        front-end walks rows chronologically (ASC) and compares each row's
        prev_hash to the prior row's hash, exposing any chain break. The
        endpoint is read-only; chain integrity is computed by the caller,
        not asserted by the server. Empty `audit_events` table returns
        `events: []` honestly. Owner-only.
      tags: [AuditChain]
      x-kye-source-file: public/admin/functions/api/v1/audit-chain.js
      parameters:
        - { name: tenant_id, in: query, required: false, schema: { type: string }, description: "Filter to one tenant" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Recent audit events + distinct tenant list for filter UI
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  count: { type: integer }
                  limit: { type: integer }
                  tenant_id_filter: { type: string }
                  tenants_present: { type: array, items: { type: string } }
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        event_id: { type: string }
                        event_type: { type: string }
                        actor_email: { type: string }
                        tenant_id: { type: string }
                        decided_at: { type: string, format: date-time }
                        signature_kid: { type: string }
                        hash: { type: string }
                        prev_hash: { type: string }
                        event_sequence: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Audit Cold Storage (R2) ───────────────────────────────────────────────
  /audit-cold:
    get:
      operationId: admin-list-audit-cold-objects
      summary: Browse R2 cold-storage audit archives
      description: |
        Lists objects in the `kye-audit-cold` R2 bucket (binding
        `KYE_AUDIT_COLD_R2`). When the R2 binding is unbound (e.g. preview
        deploys) returns an honest empty payload with `note: "r2_not_bound"`
        rather than failing. Filters by `prefix` or `tenant` (which maps to
        the `${tenant}/` prefix). Also returns the pending/approved restore
        requests from `audit_cold_restores` so the operator sees outstanding
        dual-control restores in the same view. Owner-only, read-only.
      tags: [AuditCold]
      x-kye-source-file: public/admin/functions/api/v1/audit-cold.js
      parameters:
        - { name: prefix, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: tenant, in: query, required: false, schema: { type: string }, description: "Convenience filter — equivalent to prefix=<tenant>/" }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: "R2 list cursor for pagination" }
      responses:
        "200":
          description: R2 object listing (or honest unbound state) + pending restores
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  note: { type: string, example: "r2_not_bound" }
                  objects:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        size: { type: integer }
                        uploaded: { type: string, format: date-time }
                        etag: { type: string }
                        sha256: { type: string }
                        sealed_at: { type: string, format: date-time }
                        tenant_id: { type: string }
                  truncated: { type: boolean }
                  cursor: { type: string }
                  pending_restores: { type: array, items: { type: object } }
                  summary:
                    type: object
                    properties:
                      count: { type: integer }
                      size: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: R2 list call failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: admin-request-audit-cold-restore
      summary: Request (or 2nd-approve) a cold-storage audit restore
      description: |
        Two operations on the same endpoint, switched by `op`:
        (1) **restore** (default) — inserts a `pending` row into
        `audit_cold_restores` with the requesting operator, reason (min 8
        chars), and target object_key.
        (2) **approve** — flips a `pending` restore to `approved` provided
        the approver is NOT the original requester (dual-control: anti
        self-approval enforced by 403). The restore is only executed once
        the row is `approved`, by a separate background consumer. Owner-only.
        Reversibility: a pending request can be cancelled out-of-band but
        not via this endpoint.
      tags: [AuditCold]
      x-kye-source-file: public/admin/functions/api/v1/audit-cold.js
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [object_key, reason]
                  properties:
                    op: { type: string, enum: [restore], default: restore }
                    object_key: { type: string, maxLength: 500 }
                    reason: { type: string, minLength: 8, maxLength: 2000 }
                    tenant_id: { type: string, maxLength: 200 }
                - type: object
                  required: [op, restore_id]
                  properties:
                    op: { type: string, enum: [approve] }
                    restore_id: { type: string }
            examples:
              restore:
                summary: Initial restore request
                value: { object_key: "kye:tenant:acme/2026-05/audit-batch-00042.wormpack", reason: "Regulator SAR-2026-117 covering 2026-05-01..2026-05-15", tenant_id: "kye:tenant:acme" }
              approve:
                summary: Second-approver confirms
                value: { op: approve, restore_id: "kye:audit-cold-restore:b7d9f2c4-1a3e-4f5b-90c8-2e6a8f1b3c5d" }
      responses:
        "200":
          description: Restore approved by 2nd approver
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  restore_id: { type: string }
                  status: { type: string, enum: [approved] }
                  approved_by: { type: string }
        "201":
          description: Restore requested; status=pending awaiting 2nd approver
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  restore_id: { type: string }
                  status: { type: string, enum: [pending] }
                  requested_by: { type: string }
                  requested_at: { type: string, format: date-time }
        "400":
          description: Invalid JSON, missing object_key, or reason below 8-char minimum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Self-approval attempt — the requester cannot approve their own restore
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: restore_id not found (approve op)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Restore is not in `pending` status (approve op)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "412":
          description: Second approver missing for dual-control approve
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Decisions feed (PDP cross-tenant) ─────────────────────────────────────
  /decisions:
    get:
      operationId: admin-list-decisions
      summary: List recent cross-tenant PDP decisions
      description: |
        Returns up to 500 recent rows from `decisions` — the canonical
        Purpose Permission™ Decision Engine output, written by every agent
        worker via the self-audit-daemon schema. Supports filters by tenant,
        decision verdict, since-timestamp, and free-text on
        decision_id / actor / capability. The response also includes a
        verdict-class tally and a top-50 per-tenant rollup. Empty table
        returns `decisions: []` honestly. Owner-only, read-only.
      tags: [Decisions]
      x-kye-source-file: public/admin/functions/api/v1/decisions.js
      parameters:
        - { name: tenant, in: query, required: false, schema: { type: string } }
        - { name: decision, in: query, required: false, schema: { type: string }, description: "Verdict filter (e.g. permit / deny / abstain)" }
        - { name: since, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: q, in: query, required: false, schema: { type: string }, description: "LIKE on decision_id / actor / capability" }
      responses:
        "200":
          description: Decisions + per-verdict and per-tenant rollups
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  total: { type: integer }
                  counts: { type: object, additionalProperties: { type: integer } }
                  per_tenant:
                    type: array
                    items:
                      type: object
                      properties:
                        tenant_id: { type: string }
                        n: { type: integer }
                  decisions:
                    type: array
                    items:
                      type: object
                      properties:
                        decision_id: { type: string }
                        operating_model_id: { type: string }
                        tenant_id: { type: string }
                        decided_at: { type: string, format: date-time }
                        actor: { type: string }
                        principal: { type: string }
                        capability: { type: string }
                        decision: { type: string }
                        reason_code: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Evidence Pack Index ───────────────────────────────────────────────────
  /evidence-index:
    get:
      operationId: admin-list-evidence-packs
      summary: List signed evidence packs across all tenants
      description: |
        Reads `evidence_index` — every signed evidence pack indexed at
        emission per §30 WORM contract (R2 Object Lock is the authoritative
        store; this D1 row is the searchable index). Filters by tenant, pack
        class, time window (24h / 7d / 30d / 90d / all), and free-text on
        pack_id / tenant_id / signing_kid. KPI block reports total,
        24h volume, currently-locked-by-retention count, and signature
        failures. Pagination via `limit` (default 200, max 500) and
        `offset`. Owner-only, read-only.
      tags: [Evidence]
      x-kye-source-file: public/admin/functions/api/v1/evidence-index.js
      parameters:
        - { name: tenant_id, in: query, required: false, schema: { type: string } }
        - name: pack_class
          in: query
          required: false
          schema: { type: string, enum: [decision_evidence, data_use_evidence, dsar_evidence, compliance_attestation, resilience_loop] }
        - name: window
          in: query
          required: false
          schema: { type: string, enum: ["24h", "7d", "30d", "90d", "all"], default: "7d" }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Indexed evidence packs + KPI + tenant facet
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  kpi:
                    type: object
                    properties:
                      packs_24h: { type: integer }
                      total: { type: integer }
                      locked: { type: integer }
                      sig_failures: { type: integer }
                  tenants: { type: array, items: { type: string } }
                  count: { type: integer }
                  evidence_packs:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        evidence_pack_id: { type: string }
                        tenant_id: { type: string }
                        pack_class: { type: string }
                        signing_kid: { type: string }
                        signed_by: { type: string }
                        signed_at: { type: string, format: date-time }
                        retain_until: { type: string, format: date-time }
                        r2_object_key: { type: string }
                        signature_ok: { type: integer, enum: [0, 1] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Evidence Timeline (per action proposal) ───────────────────────────────
  /evidence-timeline:
    get:
      operationId: admin-get-evidence-timeline
      summary: Get the lifecycle timeline for one action proposal
      description: |
        Two modes:
        (1) **picker** — `?action_id=` omitted → returns the 50 most recent
        rows from `app_action_approvals` for the proposal-picker UI.
        (2) **timeline** — `?action_id=<id>` → returns the observable
        lifecycle steps (proposed → routed → decided → evidence sealed)
        for that one proposal. Envelope signing + replay-proof construction
        are patent-track and intentionally not surfaced here. The
        `app_action_approvals` table is owned by the Cloud surface (§0 — no
        duplicate runtime CREATE here); this is a cross-tenant read. Owner-only.
      tags: [Evidence]
      x-kye-source-file: public/admin/functions/api/v1/evidence-timeline.js
      parameters:
        - { name: action_id, in: query, required: false, schema: { type: string }, description: "Action proposal ID — omit to list recent proposals" }
      responses:
        "200":
          description: Picker rows OR per-proposal timeline (empty steps for unknown id)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  recent: { type: array, items: { type: object } }
                  action_id: { type: string }
                  proposal: { type: object }
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        seq: { type: integer }
                        at: { type: string, format: date-time }
                        label: { type: string }
                        detail: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Critical-Point Review queue ───────────────────────────────────────────
  /critical-point-review:
    get:
      operationId: admin-list-critical-point-reviews
      summary: List dual-control reviews (two-person / two-person-with-legal)
      description: |
        Returns the subset of `app_action_approvals` whose approval_mode
        requires dual control: `two_person` (SR 11-7 model-risk control)
        or `two_person_with_legal` (EU AI Act Art. 14 human-oversight).
        Filters by mode, state (pending / approved / rejected / escalated),
        and free-text on proposal_id / actor_id / action_type / tenant_id.
        KPI block reports pending count, mode split, and decided count.
        The `app_action_approvals` table is owned by the Cloud surface
        (§0 — no duplicate runtime CREATE here). Owner-only, read-only.
      tags: [CriticalReviews]
      x-kye-source-file: public/admin/functions/api/v1/critical-point-review.js
      parameters:
        - name: mode
          in: query
          required: false
          schema: { type: string, enum: [two_person, two_person_with_legal] }
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [pending, approved, rejected, escalated] }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Critical-point reviews + KPI
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  count: { type: integer }
                  kpi:
                    type: object
                    properties:
                      pending: { type: integer }
                      two_person: { type: integer }
                      with_legal: { type: integer }
                      decided: { type: integer }
                  reviews:
                    type: array
                    items:
                      type: object
                      properties:
                        proposal_id: { type: string }
                        tenant_id: { type: string }
                        actor_id: { type: string }
                        action_type: { type: string }
                        target_system: { type: string }
                        risk_level: { type: string }
                        approval_mode: { type: string }
                        state: { type: string }
                        proposed_at: { type: string, format: date-time }
                        decided_at: { type: string, format: date-time }
                        decided_by: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Replay (queue + verdict) ──────────────────────────────────────────────
  /replay-tools:
    get:
      operationId: admin-get-replay-tools
      summary: List recent admin Replay-Proof™ runs with verdict KPI
      description: |
        Reads the append-only `admin_replays` table (newest 200) with
        optional filters by verdict (pending / verified / diverged /
        signature_failed) and tenant. Returns a KPI block counting each
        verdict over the returned rows plus the distinct tenant list for
        the filter dropdown. Verdicts are resolved out-of-band by the
        Replay Engine; this surface is read-only. Owner-only.
      tags: [Replay]
      x-kye-source-file: public/admin/functions/api/v1/replay-tools.js
      parameters:
        - name: verdict
          in: query
          required: false
          schema: { type: string, enum: [pending, verified, diverged, signature_failed] }
        - { name: tenant_id, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Replay runs + verdict KPI + tenant filter values
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  count: { type: integer }
                  kpi:
                    type: object
                    properties:
                      total: { type: integer }
                      pending: { type: integer }
                      verified: { type: integer }
                      diverged: { type: integer }
                      signature_failed: { type: integer }
                  tenants:
                    type: array
                    items: { type: string }
                  replays:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        evidence_pack_id: { type: string }
                        tenant_id: { type: string }
                        requested_by: { type: string }
                        verdict: { type: string, enum: [pending, verified, diverged, signature_failed] }
                        divergences_json: { type: string }
                        replay_proof_id: { type: string }
                        replay_proof_at: { type: string, format: date-time }
                        notes: { type: string }
                        created_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: admin-queue-replay
      summary: Queue a Replay-Proof™ run for an evidence pack
      description: |
        Inserts an append-only row into `admin_replays` (WORM — no
        UPDATE/DELETE) with `verdict='pending'`. The Replay Engine consumes
        the queued run, resolves the verdict (verified / diverged /
        signature_failed), and appends the `kye.replay.proof.v1` envelope
        out-of-band. The verification mechanism is patent-track and is not
        disclosed here. Returns 404 if the referenced evidence_pack_id is
        not in `evidence_packs`. Owner-only. Reversibility: none — replay
        records are append-only.
      tags: [Replay]
      x-kye-source-file: public/admin/functions/api/v1/replay-tools.js
      x-kye-emits-envelopes: [kye.replay.proof.v1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evidence_pack_id]
              properties:
                evidence_pack_id:
                  type: string
                  pattern: "^kye:evidence-pack:"
                  example: "kye:evidence-pack:acme.2026-05-27.0001"
                notes: { type: string, maxLength: 2000 }
            examples:
              regulator-spot-check:
                value: { evidence_pack_id: "kye:evidence-pack:acme.2026-05-27.0001", notes: "Regulator SAR-2026-117 verification batch" }
      responses:
        "201":
          description: Replay queued; verdict=pending until the Replay Engine resolves it
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  replay:
                    type: object
                    properties:
                      id: { type: string }
                      evidence_pack_id: { type: string }
                      tenant_id: { type: string }
                      requested_by: { type: string }
                      verdict: { type: string, enum: [pending] }
                      divergences: { type: array, items: { type: object } }
                      replay_proof_id: { type: string }
                      replay_proof_at: { type: string, format: date-time }
                      created_at: { type: string, format: date-time }
        "400":
          description: evidence_pack_id missing or does not start with `kye:evidence-pack:`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: evidence_pack_id not found in evidence_packs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Audit Stream DELETE (405) — declared inline above on /audit-streams/{id}
  # (the delete operation lives next to GET/PATCH; this comment marks the
  # ordering checkpoint between Replay and the Pilot Application queue).

  # ── Pilot Application queue ───────────────────────────────────────────────
  /pilot-applications:
    get:
      operationId: admin-list-pilot-applications
      summary: List pilot-pipeline applications with latest decision
      description: |
        LEFT-JOINs `audit_pilot_applications` (immutable submissions from
        the public site) with the most recent row in
        `pilot_application_decisions` per application — never mutates the
        application record (append-only decisions). Returns the 200 most
        recent applications plus a queue rollup (pending / granted /
        rejected counts). Empty `audit_pilot_applications` table returns
        `applications: []` honestly. Owner-only, read-only.
      tags: [PilotApplications]
      x-kye-source-file: public/admin/functions/api/v1/pilot-applications.js
      responses:
        "200":
          description: Applications + queue rollup
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  total: { type: integer }
                  queue:
                    type: object
                    properties:
                      pending: { type: integer }
                      granted: { type: integer }
                      rejected: { type: integer }
                  applications:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        full_name: { type: string }
                        email: { type: string }
                        role: { type: string }
                        company: { type: string }
                        company_size: { type: string }
                        industry: { type: string }
                        regulatory_regime: { type: string }
                        urgency: { type: string }
                        heard_from: { type: string }
                        ip_hash: { type: string }
                        ua_hash: { type: string }
                        consent_id: { type: string }
                        created_at: { type: string, format: date-time }
                        latest_decision: { type: string, enum: [grant, reject, hold] }
                        latest_reason: { type: string }
                        granted_tenant_id: { type: string }
                        latest_decided_by: { type: string }
                        latest_decided_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /pilot-applications/{id}/grant:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "audit_pilot_applications.id" }
    post:
      operationId: admin-grant-pilot-application
      summary: Approve a pilot application and seed the full tenant tree
      description: |
        Approves a pilot and atomically seeds the v3 tenant hierarchy:
        tenants → legal_entities → billing_accounts → workspaces → teams →
        principals → team_members → principal_workspaces, plus an initial
        seed `state_events` row per entity and one append-only
        `pilot_application_decisions` row. Every INSERT uses
        `INSERT OR IGNORE` so re-grant is safe. Slug collisions are
        retried with a numeric suffix up to 4 attempts. Dual-channel
        admin: the email-action one-click URL dispatches to the same
        logic (single-use enforced by email_action_token_used UNIQUE
        constraint). Returns 409 if the application is already granted.
        Owner-only; emits §0.3 governance events via the state-evaluator.
      tags: [PilotApplications]
      x-kye-source-file: public/admin/functions/api/v1/pilot-applications/[id]/grant.js
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 1000, description: "Optional rationale recorded on the decision row" }
                region: { type: string, maxLength: 32, default: "eu-west-1" }
                sla_tier: { type: string, maxLength: 32, default: "pilot" }
                country_code: { type: string, pattern: "^[A-Z]{2}$", default: "GB" }
            examples:
              standard-grant:
                value: { reason: "Regulated bank, EU residency, pilot SKU KYE-PILOT-T2-002", region: "eu-west-1", sla_tier: "pilot", country_code: "DE" }
      responses:
        "200":
          description: Pilot granted; tenant tree seeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  application_id: { type: string }
                  tenant_id: { type: string }
                  slug: { type: string }
                  seeded:
                    type: object
                    description: Per-table row counts (tenants, legal_entities, etc.)
                    additionalProperties: { type: integer }
                  decided_by: { type: string }
                  decided_at: { type: string, format: date-time }
        "400":
          description: Missing application_id path parameter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Application not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Application already granted (idempotency guard)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "412":
          description: Second approver missing for dual-channel grant (when configured)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /pilot-applications/{id}/reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "audit_pilot_applications.id" }
    post:
      operationId: admin-reject-pilot-application
      summary: Reject a pilot application (no tenant created)
      description: |
        Appends a `reject` row into `pilot_application_decisions`. No
        tenant tree is created. Idempotent on duplicate rejects — the
        decision row is append-only and multiple rows can coexist.
        Dual-channel admin: the email-action one-click URL dispatches to
        the same logic. Owner-only; the operator is recorded as
        `decided_by`. Reversibility: a subsequent grant POST CAN succeed
        for the same application (the latest-decision rule decides the
        application's current state).
      tags: [PilotApplications]
      x-kye-source-file: public/admin/functions/api/v1/pilot-applications/[id]/reject.js
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 1000 }
            examples:
              compliance-mismatch:
                value: { reason: "Out of scope: applicant is non-regulated SaaS, KYE pilot is bank-only for 2026-Q2" }
      responses:
        "200":
          description: Rejection recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  application_id: { type: string }
                  decision: { type: string, enum: [reject] }
                  decided_by: { type: string }
                  decided_at: { type: string, format: date-time }
        "400":
          description: Missing application_id path parameter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Application not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Expert-review moderation queue ────────────────────────────────────────
  /expert-reviews/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "expert_reviews.id" }
    post:
      operationId: admin-approve-expert-review
      summary: Publish a pending expert review (moderator action)
      description: |
        Sets `expert_reviews.status='published'` with moderator + timestamp.
        Idempotent: re-approving an already-published row returns 200 with
        a no-op note. Cannot republish a previously-rejected row directly.
        On a fresh approval, dispatches the §38 Comms Engine status email
        `expert-review.approved.v1` to the submitter (background +
        fail-soft via `waitUntil` — comms failures NEVER fail the
        moderation action). Owner-only.
      tags: [ExpertReviews]
      x-kye-source-file: public/admin/functions/api/v1/expert-reviews/[id]/approve.js
      x-kye-emits-envelopes: [kye.comms.dispatch.v1]
      responses:
        "200":
          description: Review published (or already-published no-op)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  id: { type: string }
                  status: { type: string, enum: [published] }
                  note: { type: string, example: "already published" }
                  moderated_by: { type: string }
                  moderated_at: { type: string, format: date-time }
        "400":
          description: Missing id path parameter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Review id not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /expert-reviews/{id}/reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "expert_reviews.id" }
    post:
      operationId: admin-reject-expert-review
      summary: Reject a pending expert review (moderator action)
      description: |
        Sets `expert_reviews.status='rejected'` with moderator + timestamp
        and stores the rejection reason in `moderator_note` (column added
        idempotently via ALTER TABLE). Dispatches the §38 Comms Engine
        status email `expert-review.rejected.v1` to the submitter. The
        reason is recorded on the row but NOT included in the email body
        (the rejected template is reason-free, intentional). Owner-only.
      tags: [ExpertReviews]
      x-kye-source-file: public/admin/functions/api/v1/expert-reviews/[id]/reject.js
      x-kye-emits-envelopes: [kye.comms.dispatch.v1]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 1000, description: "Moderator note recorded on the row (not emailed)" }
            examples:
              quality:
                value: { reason: "Review references uncited claims about EU AI Act Art. 14; sender notified privately to revise + resubmit" }
      responses:
        "200":
          description: Review rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  id: { type: string }
                  status: { type: string, enum: [rejected] }
                  moderated_by: { type: string }
                  moderated_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Review id not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── State Transitions (gateway → patent-track evaluator) ──────────────────
  /state-transitions:
    post:
      operationId: admin-transition-state
      summary: Fire a state-machine transition (gateway to private evaluator)
      description: |
        Edge gateway only — forwards the transition request to the private
        STATE_EVALUATOR Worker which atomically (a) evaluates the
        transition guards, (b) signs the resulting `state_event` row with
        the tenant signing kid, and (c) propagates cascade effects. The
        transition-evaluation construction (guard order, canonical-form
        rule, cascade propagation) is patent-track and not disclosed here.
        Tenant scoping: every request is bounded by
        `request.kye_session.tenantId` — cross-tenant attempts return 401
        with `tenant_required` before reaching the evaluator. Returns 501
        when STATE_EVALUATOR is unbound (e.g. preview deploys).
      tags: [StateRegistry]
      x-kye-source-file: public/admin/functions/api/v1/state-transitions.js
      x-kye-emits-envelopes: [kye.state.transition.v1, kye.state.event.v1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity_class, entity_id, to_state]
              properties:
                entity_class: { type: string, example: "kye:entity-class:tenant" }
                entity_id: { type: string, example: "kye:tenant:acme" }
                to_state: { type: string, example: "active" }
                evidence_refs:
                  type: array
                  items: { type: string }
                actor_role: { type: string, example: "owner" }
                second_approver: { type: string, description: "Second-approver email for dual-control transitions" }
            examples:
              activate-tenant:
                value:
                  entity_class: "kye:entity-class:tenant"
                  entity_id: "kye:tenant:acme"
                  to_state: "active"
                  evidence_refs: ["kye:evidence-pack:acme.onboarding.0001"]
                  actor_role: "owner"
      responses:
        "200":
          description: Transition fired; signed state_event row created
          content:
            application/json:
              schema:
                type: object
                description: Whatever the private evaluator returns — signed event row + cascade summary
                additionalProperties: true
        "400":
          description: Missing required fields or invalid JSON
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Tenant not bound on session (or invalid bearer)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Guard rejected the transition (conflicting state)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "412":
          description: Second approver missing for dual-control transition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "501":
          description: STATE_EVALUATOR binding not configured on this deploy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: STATE_EVALUATOR fetch failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── State Event DELETE (405) — declared inline above on /state-events/{id}
  # (the delete operation lives next to GET; this comment marks the ordering
  # checkpoint between state-transitions and entity revocation.)

  # ── Entity emergency revocation ───────────────────────────────────────────
  /entities/{id}/revoke:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "entities.entity_id" }
    post:
      operationId: admin-revoke-entity
      summary: Force-revoke an entity cross-tenant (operator emergency action)
      description: |
        Sets `entities.lifecycle_state='revoked'` with revoked_at/by/reason
        and best-effort enqueues a cascade onto `REVOCATION_OUT` if bound.
        Reason is required (minimum 4 characters). Idempotent — re-revoking
        is a no-op that returns 200 with `note: "already revoked"`.
        Dual-channel admin: the email-action one-click URL dispatches to
        the same logic; single-use enforced by the email_action_token_used
        UNIQUE constraint. Owner-only emergency surface (§8 admin emergency
        section). Reversibility: none — recovery is re-issuance, not
        un-revoke.
      tags: [Entities]
      x-kye-source-file: public/admin/functions/api/v1/entities/[id]/revoke.js
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 4, maxLength: 1000 }
            examples:
              fraud:
                value: { reason: "Synthetic-identity ring confirmed by incident IR-7421; cascade billing + evidence purge" }
      responses:
        "200":
          description: Entity revoked (or already-revoked idempotent return)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  entity_id: { type: string }
                  status: { type: string, enum: [revoked] }
                  note: { type: string }
        "400":
          description: Missing id or reason (or reason below 4-char minimum)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Entity id not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Concurrent modification (lifecycle_state changed mid-request)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "412":
          description: Second approver missing for dual-channel revocation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Partner Program registry ────────────────────────────────────────────
  /partner-programme:
    get:
      operationId: admin-list-partners
      summary: List partner-programme registrants with tier + KPI
      description: |
        Reads the `partners` D1 table with optional filters by tier
        (foundation / certified / advanced / strategic), status (active /
        onboarding / suspended), and free-text on name / id. Returns a KPI
        block (active count, certified count, total open_deals, YTD
        revshare cents). Backed by the §10 Partner constitution + §49
        Universal Engagement Rail (partner is one of five engagement
        types). Owner-only, read-only.
      tags: [Partners]
      x-kye-source-file: public/admin/functions/api/v1/partner-programme.js
      parameters:
        - name: tier
          in: query
          required: false
          schema: { type: string, enum: [foundation, certified, advanced, strategic] }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, onboarding, suspended] }
        - { name: q, in: query, required: false, schema: { type: string }, description: "LIKE on name / id" }
      responses:
        "200":
          description: Partners + KPI
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  count: { type: integer }
                  kpi:
                    type: object
                    properties:
                      active: { type: integer }
                      certified: { type: integer }
                      open_deals: { type: integer }
                      revshare_ytd_cents: { type: integer }
                  partners:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        tier: { type: string }
                        status: { type: string }
                        contact_email: { type: string }
                        region: { type: string }
                        certifications_json: { type: string }
                        open_deals: { type: integer }
                        revshare_ytd_cents: { type: integer }
                        created_by: { type: string }
                        created_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: admin-post-partner-programme
      summary: Onboard a new partner into the partner registry
      description: |
        Inserts a row into the `partners` D1 table. `name` is required;
        tier defaults to `foundation` and status to `onboarding` when
        absent or invalid. The partner ID is minted as
        `kye:partner:<name-slug>.<6-char-uuid>` and certifications start
        empty. The operator (Clerk session email) is recorded as
        `created_by`. Backed by the §10 Partner constitution + §49
        Universal Engagement Rail. Owner-only.
      tags: [Partners]
      x-kye-source-file: public/admin/functions/api/v1/partner-programme.js
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 200 }
                tier: { type: string, enum: [foundation, certified, advanced, strategic], default: foundation }
                status: { type: string, enum: [active, onboarding, suspended], default: onboarding }
                contact_email: { type: string, maxLength: 200 }
                region: { type: string, maxLength: 64 }
                notes: { type: string, maxLength: 4000 }
      responses:
        "201":
          description: Partner created in onboarding state
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  partner:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      tier: { type: string }
                      status: { type: string }
                      contact_email: { type: string }
                      region: { type: string }
                      created_by: { type: string }
                      created_at: { type: string, format: date-time }
        "400":
          description: Missing name or non-JSON body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

