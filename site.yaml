  /api/v1/poc/apply:
    post:
      operationId: site-post-api-v1-poc-apply
      summary: Submit a Proof-of-Concept application (public)
      description: |
        Backs /poc.html. Maps the `tier` field to the canonical PoC SKU
        (discovery/undecided → KYE-POC-DISCOVERY-001, audit →
        KYE-POC-AUDIT-001, reg → KYE-POC-REG-001, govops →
        KYE-POC-GOVOPS-001, edge → KYE-POC-EDGE-001, sandbox →
        KYE-POC-SANDBOX-001), persists the `kye.poc.application.v1`
        shape to D1, then dispatches the §38 admin alert with Approve /
        Request-changes buttons and the applicant confirmation
        (§27 §4 dual-channel admin). Rate limit: 3 per 24 h per IP
        hash. Honeypot field `website`. Work email required.
      tags: [LeadCapture]
      x-kye-source-file: public/site/functions/api/v1/poc/apply.js
      x-kye-emits-envelopes: [kye.comms.dispatch.v1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier, name, email, company]
              properties:
                tier:
                  type: string
                  enum: [discovery, audit, reg, govops, edge, sandbox, undecided]
                name: { type: string }
                email: { type: string, format: email, description: Work email — free providers are rejected }
                company: { type: string }
                role: { type: string }
                workflow: { type: string, description: The AI workflow to govern in the PoC }
                frameworks: { type: string, description: Regulatory frameworks in scope }
                website: { type: string, description: Honeypot — leave empty }
      responses:
        "200":
          description: >-
            Application recorded (or honeypot discarded with
            `application_id: "discarded"`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  application_id: { type: string, format: uuid }
                  sku_id: { type: string }
        "400":
          description: >-
            Validation failure — `json_parse_failed`, `unknown_tier`
            (body lists the valid tiers), `missing_required_field`,
            `invalid_email`, `work_email_required`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500":
          description: Unhandled handler exception (message echoed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/public/stats:
    get:
      operationId: site-get-api-v1-public-stats
      summary: Public counters for the hero live ticker
      description: |
        Returns the small public counter set consumed by
        `assets/live-ticker.js` (evidence packs verified, decisions
        governed, frameworks mapped). Tier 1 reads bounded COUNT queries
        from D1 when bound; otherwise it serves the repo-derived
        snapshot (`source` pins which tier answered). Edge-cached 60 s
        to match the client poll. Emits a fire-and-forget
        `kye.compliance.attestation.v1` per response (§0.3).
      tags: [PublicData]
      x-kye-source-file: public/site/functions/api/v1/public/stats.js
      x-kye-emits-envelopes: [kye.compliance.attestation.v1]
      responses:
        "200":
          description: Current public counters
          headers:
            x-kye-schema-version:
              schema: { type: string }
              description: kye.public.stats.v1
            cache-control:
              schema: { type: string }
              description: public, max-age=60, stale-while-revalidate=300
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, evidence_packs_verified, decisions_governed, frameworks_mapped, generated_at, source]
                properties:
                  schema_version: { type: string, enum: [kye.public.stats.v1] }
                  evidence_packs_verified: { type: integer }
                  decisions_governed: { type: integer }
                  frameworks_mapped: { type: integer }
                  generated_at: { type: string, format: date-time }
                  source: { type: string, description: "`d1` or the snapshot pin" }

  /api/v1/quiz/respond:
    post:
      operationId: site-post-api-v1-quiz-respond
      summary: Record a completed quiz response (public, best-effort)
      description: |
        Evidence sink for the public quiz widget (/quiz.html →
        assets/quiz.js): the widget POSTs a `kye.quiz.response.v1`
        envelope on completion so even the lead-capture funnel lands in
        the WORM audit chain (§0.3). The client treats this as
        fire-and-forget, so the handler is resilient — it persists when
        D1 is bound, emits the audit event when the audit-chain base URL
        is set, and always answers 200 for a well-formed body so a
        transient backend wobble never breaks the share/score UX.
      tags: [PublicData]
      x-kye-source-file: public/site/functions/api/v1/quiz/respond.js
      x-kye-emits-envelopes: [kye.quiz.response.v1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quiz_id, score, band]
              properties:
                quiz_id: { type: string }
                score: { type: number }
                band: { type: string, description: Scoring band the result fell into }
                answers: { type: array, items: {}, description: "Raw answer list (persisted as JSON, capped at 8000 chars)" }
                submitted_at: { type: string, format: date-time }
      responses:
        "200":
          description: Response accepted; persistence + evidence flags reported honestly
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  response_id: { type: string, format: uuid }
                  persisted: { type: boolean }
                  evidence_recorded: { type: boolean }
        "400":
          description: "`invalid_body` (unparseable JSON) or `missing_required_field` (quiz_id, score, band)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Unhandled handler exception (truncated message echoed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /comms/unsubscribe:
    get:
      operationId: site-get-comms-unsubscribe
      summary: Human one-click unsubscribe (renders a confirmation page)
      description: |
        Destination of the canonical `link.unsubscribe` footer link in
        every §38 / §62 outbound email (PECR reg. 22, CAN-SPAM §5, GDPR
        Art. 21 — one click, no login, honoured immediately). Verifies
        the signed token in `?u=`, records the suppression through the
        ONE canonical comms-engine suppress path (the recipient travels
        as a one-way hash, never the raw email), then renders an HTML
        confirmation page. A backend hiccup still confirms intent with
        a 202 — the suppress call is idempotent on the next click.
      tags: [Comms]
      x-kye-source-file: public/site/functions/comms/unsubscribe.js
      parameters:
        - name: u
          in: query
          required: true
          schema: { type: string }
          description: Signed unsubscribe token minted into the email footer
      responses:
        "200":
          description: Suppression recorded; confirmation page rendered
          content:
            text/html:
              schema: { type: string }
        "202":
          description: Token verified but the suppress backend errored — intent acknowledged, will be actioned
          content:
            text/html:
              schema: { type: string }
        "400":
          description: Token missing, altered or expired (error page rendered)
          content:
            text/html:
              schema: { type: string }
    post:
      operationId: site-post-comms-unsubscribe
      summary: RFC 8058 one-click unsubscribe (mail-client POST)
      description: |
        Mail clients POST `List-Unsubscribe=One-Click` here; the signed
        token rides in `?u=` and/or the form/JSON body (`u` or `token`).
        No HTML is returned — a 2xx text/plain is the RFC 8058 contract.
        Suppression goes through the same canonical comms-engine path as
        the GET flow.
      tags: [Comms]
      x-kye-source-file: public/site/functions/comms/unsubscribe.js
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                u: { type: string, description: Signed unsubscribe token }
                token: { type: string, description: Accepted alias for `u` }
                List-Unsubscribe: { type: string, description: "RFC 8058 literal `One-Click`" }
          application/json:
            schema:
              type: object
              properties:
                u: { type: string }
                token: { type: string }
      responses:
        "200":
          description: Suppression recorded ("unsubscribed")
          content:
            text/plain:
              schema: { type: string }
        "202":
          description: Token verified, suppress backend errored — accepted for action
          content:
            text/plain:
              schema: { type: string }
        "400":
          description: Missing or invalid token
          content:
            text/plain:
              schema: { type: string }

  "/trust/self-audit/live/{[path}]":
    get:
      operationId: site-get-trust-self-audit-live-by-path
      summary: Fetch a production-signed live self-audit bundle (public)
      description: |
        Public read side of §0.3 self-governance-on-production: serves
        the Ed25519-signed live self-audit bundles the
        kye-self-audit-daemon Worker publishes to the shared R2 bucket.
        The catch-all segment addresses one partition —
        `latest`, `latest/bundle.json`, `<YYYY-MM-DD>/` or
        `<YYYY-MM-DD>/bundle.json`; an empty segment resolves to
        `latest`. Any other shape is rejected (no arbitrary R2
        traversal). Anyone can verify the signature against
        /trust/self-audit-jwks.json with
        `node scripts/verify-self-audit.mjs`. Edge-cached 5 minutes.
      tags: [Trust]
      x-kye-source-file: public/site/functions/trust/self-audit/live/[[path]].js
      parameters:
        - name: "[path"
          in: path
          required: true
          schema: { type: string }
          description: >-
            Catch-all partition selector — `latest` or a `YYYY-MM-DD`
            date, optionally followed by `/bundle.json`.
      responses:
        "200":
          description: The signed bundle bytes, verbatim
          headers:
            x-kye-trust-surface:
              schema: { type: string }
              description: self-audit-live
            x-kye-key-class:
              schema: { type: string }
              description: production
          content:
            application/json:
              schema:
                type: object
                description: Ed25519-signed self-audit bundle envelope
        "404":
          description: >-
            Non-addressable path shape (`not_found`) or no bundle
            published for the partition yet (`no_live_bundle`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: R2 binding not attached on this deployment (`r2_binding_unavailable`) — honest machine-readable fail, never a synthesised bundle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /webhooks/clerk:
    get:
      operationId: site-get-webhooks-clerk
      summary: Webhook receiver self-description
      description: >-
        Returns the receiver hint plus the list of the 18 routed Clerk
        event types, so a GET probe of the configured webhook URL is
        self-documenting.
      tags: [Webhooks]
      x-kye-source-file: public/site/functions/webhooks/clerk.js
      responses:
        "200":
          description: Receiver hint + routed event list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  message: { type: string }
                  routed_events:
                    type: array
                    items: { type: string }
    post:
      operationId: site-post-webhooks-clerk
      summary: Receive a Clerk webhook delivery (Svix-signed)
      description: |
        Verifies the Svix v1 signature (svix-id / svix-timestamp /
        svix-signature headers) against the configured signing secret,
        then projects each of the 18 routed Clerk event types
        (user.*, session.*, organization.*, organizationMembership.*,
        organizationInvitation.*, invitation.*) to a
        `kye.evidence.<bucket>.<verb>.v1` envelope persisted to R2 and
        fanned out on the webhook queue when those bindings are wired.
        Recognised events are always ACKed 200 even if a downstream
        projection fails (the audit chain is canonical; the D1
        projection is rebuildable) — Clerk's retry budget is small and
        a half-applied projection is worse than a missed one. With the
        secret unset the endpoint answers 503 so Clerk retries with
        backoff.
      tags: [Webhooks]
      x-kye-source-file: public/site/functions/webhooks/clerk.js
      x-kye-emits-envelopes: [kye.evidence.identity.created.v1, kye.evidence.session.created.v1, kye.evidence.organization.created.v1]
      parameters:
        - name: svix-id
          in: header
          required: true
          schema: { type: string }
        - name: svix-timestamp
          in: header
          required: true
          schema: { type: string }
        - name: svix-signature
          in: header
          required: true
          schema: { type: string }
          description: Space-separated `v1,<base64>` signature tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Clerk webhook payload (`type` + `data`), verified raw before parsing
              properties:
                type: { type: string }
                data: { type: object }
      responses:
        "200":
          description: Delivery verified and acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  type: { type: string, description: The Clerk event type }
                  event_id: { type: string, description: The svix-id of the delivery }
        "400":
          description: "`missing_svix_headers` or `invalid_json`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: "`invalid_signature` or `signature_verification_failed`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: "`webhook_secret_unconfigured` — signing secret unset; Clerk will retry"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
