  /api/marketplace/consultants:
    get:
      operationId: site-get-api-marketplace-consultants
      summary: List visible consultants for the public marketplace
      description: |
        Returns every consultant whose status is `onboarding` or
        `certified` (master → professional → associate, then newest
        first) for the Consultant Marketplace™ page, with facet counts
        for the filter UI. Email addresses are never returned and
        applicant lead rows are never exposed. Edge-cached for 5
        minutes. Without the D1 binding (or before the table exists)
        the endpoint degrades to an honest empty list
        (`not_provisioned: true`).
      tags: [Marketplace]
      x-kye-source-file: public/site/functions/api/marketplace/consultants.js
      parameters:
        - name: sector
          in: query
          required: false
          schema: { type: string }
          description: Keep only consultants whose sectors include this tag
        - name: jurisdiction
          in: query
          required: false
          schema: { type: string, maxLength: 2 }
          description: ISO-3166 alpha-2 country filter
        - name: level
          in: query
          required: false
          schema: { type: string, enum: [associate, professional, master] }
          description: Certification-level filter
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
          description: Case-insensitive name / bio match
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 60, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Visible consultants + facet counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  not_provisioned: { type: boolean, description: Present when D1 or the table is absent }
                  total: { type: integer }
                  consultants:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        display_name: { type: string }
                        country: { type: string }
                        sectors: { type: array, items: { type: string } }
                        languages: { type: array, items: { type: string } }
                        bio: { type: string }
                        website: { type: string }
                        linkedin: { type: string }
                        status: { type: string, enum: [onboarding, certified] }
                        certification_level: { type: string }
                        attribution_kid: { type: string }
                        created_at: { type: string, format: date-time }
                  facets:
                    type: object
                    properties:
                      sectors: { type: object, additionalProperties: { type: integer } }
                      jurisdictions: { type: object, additionalProperties: { type: integer } }
                      levels: { type: object, additionalProperties: { type: integer } }
        "500":
          description: Query failed (truncated message echoed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    options:
      operationId: site-options-marketplace-consultants
      summary: CORS preflight for the marketplace listing
      description: >-
        Answers 204 allowing GET/OPTIONS with the content-type header
        from the https://kyeprotocol.com origin, cacheable for 24 h.
      tags: [Marketplace]
      x-kye-source-file: public/site/functions/api/marketplace/consultants.js
      responses:
        "204":
          description: Preflight accepted (empty body)
          headers:
            access-control-allow-origin:
              schema: { type: string }
              description: https://kyeprotocol.com
            access-control-allow-methods:
              schema: { type: string }
              description: "GET, OPTIONS"
            access-control-allow-headers:
              schema: { type: string }
              description: content-type
            access-control-max-age:
              schema: { type: string }
              description: "86400"

