openapi: "3.1.0"
info:
  title: KYE Protocol™ Site API
  version: "1.0.0"
  description: |
    Public-site Pages Functions surface for kyeprotocol.com — the
    lead-capture forms (Audit Pilot™, PoC, GovernedUI access, contact),
    DSAR intake, expert-review wall, the Consultant Marketplace™ public
    listing, the public stats ticker, the quiz evidence sink, the §38
    Comms Engine™ unsubscribe surface, the Clerk webhook receiver and
    the public self-audit trust surface.

    Operations are unauthenticated public form endpoints unless noted.
    Form endpoints are rate-limited per salted IP hash (the raw IP is
    never stored) and carry a hidden `website` honeypot field — a
    non-empty honeypot is silently discarded with a 200 so bots learn
    nothing. Outbound email always routes through the KYE Comms
    Engine™ (constitution §38); privileged actions emit the §0.3
    evidence-event family.

servers:
  - url: https://kyeprotocol.com
    description: Production public site

# Public-by-default: the site surface is the unauthenticated marketing
# origin. The single operator-only operation (the worker healthcheck)
# overrides this with HealthcheckBearer.
security: []

tags:
  - name: Internal
    description: Operator-only diagnostics (shared-secret gated)
  - name: LeadCapture
    description: Public application + enquiry forms
  - name: Dsar
    description: Data Subject Access Request intake
  - name: ExpertReviews
    description: Expert-wall review submission + public listing
  - name: Marketplace
    description: Consultant Marketplace™ public directory
  - name: PublicData
    description: Unauthenticated read-only public data
  - name: Comms
    description: KYE Comms Engine™ self-service opt-out surface
  - name: Webhooks
    description: Inbound vendor webhook receivers
  - name: Trust
    description: Public self-audit trust surface (§0.3 read side)

components:
  securitySchemes:
    HealthcheckBearer:
      type: http
      scheme: bearer
      description: >-
        Shared secret (HEALTHCHECK_INTERNAL_TOKEN on the kye-protocol
        Pages project) passed by the healthcheck-workers.yml workflow.

  schemas:
    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, enum: [false] }
        error: { type: string, description: Machine-readable error code }
    RateLimitedResponse:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, enum: [false] }
        error: { type: string, enum: [rate_limited] }
        retry_after_seconds: { type: integer }
    HoneypotAccepted:
      type: object
      description: >-
        Returned when the hidden `website` honeypot field is non-empty.
        The submission is silently discarded; the 200 prevents bots from
        learning the form was rejected.
      properties:
        ok: { type: boolean, enum: [true] }
        ignored: { type: string, enum: [honeypot] }

  responses:
    RateLimited:
      description: >-
        Per-IP-hash rate limit exceeded. The `retry-after` header carries
        the wait in seconds.
      headers:
        retry-after:
          schema: { type: string }
          description: Seconds until the window reopens
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RateLimitedResponse" }

paths:
  /api/_internal/healthcheck-workers:
    get:
      operationId: site-get-api-internal-healthcheck-workers
      summary: Fan-out healthcheck of every deployed KYE Worker (operator-only)
      description: |
        Probes each deployed KYE Worker's `/healthz` via the Service
        bindings configured on the kye-protocol Pages project (the only
        reachable path because every Worker runs with `workers_dev=false`
        and no public route). Returns one JSON payload with a per-worker
        status, latency and version, plus a summary block; the
        healthcheck-workers.yml workflow archives it to
        `_diagnostics/healthcheck/<ts>.json`. Gated by the
        `HEALTHCHECK_INTERNAL_TOKEN` shared secret when set.
      tags: [Internal]
      x-kye-source-file: public/site/functions/api/_internal/healthcheck-workers.js
      security:
        - HealthcheckBearer: []
      responses:
        "200":
          description: Every probed Worker reported healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_at: { type: string, format: date-time }
                  workers:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        status: { type: string, enum: [healthy, unhealthy] }
                        checks: { type: [object, "null"] }
                        version: { type: [string, "null"] }
                        deployed_at: { type: [string, "null"] }
                        http_status: { type: integer }
                        latency_ms: { type: integer }
                        error: { type: [string, "null"] }
                  summary:
                    type: object
                    properties:
                      total: { type: integer }
                      healthy: { type: integer }
                      unhealthy: { type: integer }
                      unhealthy_names:
                        type: array
                        items: { type: string }
        "207":
          description: >-
            Multi-status — at least one Worker reported unhealthy (same
            body shape as the 200).
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_at: { type: string, format: date-time }
                  workers: { type: array, items: { type: object } }
                  summary: { type: object }
        "401":
          description: Bearer token missing or mismatched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/audit-pilot:
    get:
      operationId: site-get-api-audit-pilot
      summary: Endpoint self-description for the Audit Pilot™ application form
      description: >-
        Returns a small JSON descriptor (expected method + the
        pilot-apply page URL) so a GET probe of the form endpoint is
        self-documenting rather than a 405.
      tags: [LeadCapture]
      x-kye-source-file: public/site/functions/api/audit-pilot.js
      responses:
        "200":
          description: Endpoint descriptor
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  endpoint: { type: string }
                  method: { type: string, enum: [POST] }
                  doc: { type: string, format: uri }
    post:
      operationId: site-post-api-audit-pilot
      summary: Submit an Audit Pilot™ application (public)
      description: |
        Receives the pilot-apply form (JSON or form-data), validates the
        enum fields (role, company size, industry, urgency, SKU), blocks
        free-email-provider addresses, requires all four consent clauses
        (tos, privacy, aup, authority), emits a signed
        `kye.consent.acceptance.v1` record, persists application +
        consent to D1, then in the background dispatches the §38 admin
        alert + applicant confirmation (suppressed for detected test
        traffic) and enqueues the §22 onboarding and §27
        commercial-lifecycle workflows. Rate limit: 3 submissions per
        24 h per IP hash. Honeypot field `website`.
      tags: [LeadCapture]
      x-kye-source-file: public/site/functions/api/audit-pilot.js
      x-kye-emits-envelopes: [kye.consent.acceptance.v1, kye.comms.dispatch.v1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, role, company, company_size, industry, ai_workflow, urgency, sku_id]
              properties:
                full_name: { type: string, maxLength: 200 }
                email: { type: string, format: email, description: Work email — free providers are rejected }
                role:
                  type: string
                  enum: [CISO, CDO, Head of AI, Head of Compliance, Procurement Lead, Engineering Lead, Other]
                company: { type: string, maxLength: 200 }
                company_size:
                  type: string
                  enum: ["<100", "100-1k", "1k-10k", "10k-50k", "50k+"]
                industry:
                  type: string
                  enum:
                    - Financial Services - Banking
                    - Financial Services - Insurance
                    - Financial Services - Payments/PSP
                    - Healthcare
                    - Pharma
                    - Public Sector
                    - Other Regulated
                    - Other
                regulatory_regime:
                  description: One or more applicable regulators (unknown values are dropped)
                  oneOf:
                    - type: string
                    - type: array
                      items: { type: string }
                ai_workflow: { type: string, minLength: 30, maxLength: 4000 }
                urgency:
                  type: string
                  enum: [This quarter, Next quarter, This half, Within 12 months, Exploring]
                sku_id:
                  type: string
                  enum:
                    - KYE-DISCOVERY-001
                    - KYE-AUDIT-PILOT-001
                    - KYE-REG-PILOT-001
                    - KYE-GOVOPS-PILOT-001
                    - KYE-EDGE-PILOT-001
                    - KYE-SANDBOX-PILOT-001
                    - KYE-CKAN-AUDIT-PILOT-001
                    - KYE-CKAN-GOVOPS-PILOT-001
                    - UNDECIDED
                heard_from: { type: string, maxLength: 500 }
                consent_tos: { description: Must be accepted, oneOf: [{ type: boolean }, { type: string }] }
                consent_privacy: { description: Must be accepted, oneOf: [{ type: boolean }, { type: string }] }
                consent_aup: { description: Must be accepted, oneOf: [{ type: boolean }, { type: string }] }
                consent_authority: { description: Must be accepted, oneOf: [{ type: boolean }, { type: string }] }
                consent_dpa: { description: Optional DPA clause, oneOf: [{ type: boolean }, { type: string }] }
                website: { type: string, description: Honeypot — leave empty }
          application/x-www-form-urlencoded:
            schema:
              type: object
              description: Same fields as the JSON body; multi-select regulatory_regime arrives as repeated keys.
      responses:
        "200":
          description: >-
            Application accepted (or honeypot silently discarded). The
            signed consent record is echoed back so the client can store
            the receipt.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      ok: { type: boolean, enum: [true] }
                      application_id: { type: string, description: "kye:audit-pilot-app:<date>.<hex>" }
                      consent_id: { type: string }
                      consent:
                        type: object
                        description: The kye.consent.acceptance.v1 record (hashed subject identifiers only)
                      next_steps: { type: string }
                  - $ref: "#/components/schemas/HoneypotAccepted"
        "400":
          description: >-
            Validation failure. Error codes include `invalid_body`,
            `missing_field:<name>`, `invalid_sku_id`,
            `invalid_email_shape`, `free_email_provider_blocked`,
            `invalid_role`, `invalid_company_size`, `invalid_industry`,
            `invalid_urgency`, `ai_workflow_too_short`,
            `consent_missing:<clause>`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/contact:
    get:
      operationId: site-get-api-contact
      summary: Endpoint self-description for the contact form
      tags: [LeadCapture]
      x-kye-source-file: public/site/functions/api/contact.js
      responses:
        "200":
          description: Hint that the endpoint accepts POSTed contact forms
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  message: { type: string }
    post:
      operationId: site-post-api-contact
      summary: Submit the contact-modal form (public)
      description: |
        Receives the contact-modal submission from any KYE Protocol™
        page (JSON or form-urlencoded), validates + spam-filters it,
        dispatches the §38 `contact.inbound.v1` admin notification (with
        one-click Approve/Reject buttons for partner/trainer/auditor
        topics, §27 §4 dual-channel admin) and a
        `contact.applicant-ack.v1` receipt to the submitter, then
        persists an audit row to D1. Rate limit: 5 submissions per IP
        per 5 minutes. Honeypot field `website`. When the mail binding
        is unattached the endpoint answers 503 with
        `fallback: "mailto"` so the client degrades to a mailto: link —
        a submission is never silently dropped.
      tags: [LeadCapture]
      x-kye-source-file: public/site/functions/api/contact.js
      x-kye-emits-envelopes: [kye.comms.dispatch.v1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, organisation, phone, position, message, accept]
              properties:
                name: { type: string, maxLength: 200 }
                email: { type: string, format: email, maxLength: 320 }
                organisation: { type: string, maxLength: 200 }
                phone: { type: string, maxLength: 50 }
                position: { type: string, maxLength: 100 }
                topic: { type: string, description: Routing topic (default `general`; partner/trainer/auditor get admin action buttons) }
                message: { type: string, maxLength: 8000 }
                accept: { description: Terms + privacy acceptance — required truthy, oneOf: [{ type: boolean }, { type: string }] }
                website: { type: string, description: Honeypot — leave empty }
          application/x-www-form-urlencoded:
            schema:
              type: object
              description: Same fields as the JSON body.
      responses:
        "200":
          description: Mail dispatched (or honeypot silently discarded)
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      ok: { type: boolean, enum: [true] }
                      message_id: { type: string }
                  - $ref: "#/components/schemas/HoneypotAccepted"
        "400":
          description: >-
            Validation failure — `invalid_body`, `missing_field:<name>`,
            `invalid_email`, `terms_not_accepted`, `message_too_long`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: The mail-sender dispatch failed; client should fall back to mailto
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [false] }
                  fallback: { type: string, enum: [mailto] }
                  error: { type: string, enum: [send_failed_cf] }
        "503":
          description: Mail binding unattached on this deployment; client should fall back to mailto
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [false] }
                  fallback: { type: string, enum: [mailto] }
                  error: { type: string, enum: [mail_binding_unconfigured] }

  /api/dsar:
    get:
      operationId: site-get-api-dsar
      summary: Endpoint self-description for the DSAR intake
      tags: [Dsar]
      x-kye-source-file: public/site/functions/api/dsar.js
      responses:
        "200":
          description: Hint describing the expected POST body
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  message: { type: string }
                  documentation: { type: string, format: uri }
    post:
      operationId: site-post-api-dsar
      summary: File a Data Subject Access Request (public)
      description: |
        Self-service DSAR intake under GDPR Art. 15–21 and the
        equivalent rights in UK GDPR, CCPA/CPRA, PIPEDA, LGPD, PIPL and
        POPIA (backs /dsar.html). Mints a stable
        `kye:dsar-request:<date>.<hex>` reference, persists a WORM row
        to D1 (status transitions are append-only via supersession),
        emits a §0.3 `kye.evidence.decision_map.v1` event
        (`dsar_request.filed`), then sends the §38 admin alert with
        one-click Acknowledge/Reject buttons and a subject
        acknowledgement carrying the statutory deadline. Rate limit: 5
        requests per 24 h per IP hash.
      tags: [Dsar]
      x-kye-source-file: public/site/functions/api/dsar.js
      x-kye-emits-envelopes: [kye.evidence.decision_map.v1, kye.comms.dispatch.v1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [controller, right, email, consent]
              properties:
                controller: { type: string, maxLength: 200, description: The data controller the request targets }
                right:
                  type: string
                  enum: [access, rectification, erasure, restriction, portability, objection, withdraw_consent, ccpa_know, ccpa_delete, ccpa_opt_out]
                regime:
                  type: string
                  default: gdpr
                  enum: [gdpr, uk_gdpr, ccpa, pipeda, lgpd, pipl, popia, other]
                email: { type: string, format: email, maxLength: 200 }
                name: { type: string, maxLength: 200 }
                detail: { type: string, maxLength: 4000, description: Specific items / time window }
                consent: { type: boolean, description: Must be `true` }
      responses:
        "201":
          description: Request filed; statutory window computed per regime
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  request_id: { type: string, description: "kye:dsar-request:<date>.<hex>" }
                  filed_at: { type: string, format: date-time }
                  due_at: { type: string, format: date-time }
                  statutory_window_days: { type: integer, description: 30 (GDPR-family) / 45 (CCPA) / 90 (POPIA) }
                  regime: { type: string }
                  right: { type: string }
        "400":
          description: >-
            Validation failure — body carries `reason` ∈ {invalid_json,
            controller_required, invalid_right, invalid_regime,
            invalid_email, consent_required}.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [false] }
                  reason: { type: string }
        "429":
          description: More than 5 requests in 24 h from the same IP hash
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [false] }
                  reason: { type: string, enum: [rate_limited] }
    options:
      operationId: site-options-dsar
      summary: CORS preflight for the DSAR intake
      description: >-
        Answers 204 with the allowed methods (POST, GET, OPTIONS) and
        allowed request header (content-type). No allow-origin header is
        set — the form is same-origin on kyeprotocol.com.
      tags: [Dsar]
      x-kye-source-file: public/site/functions/api/dsar.js
      responses:
        "204":
          description: Preflight accepted (empty body)
          headers:
            allow:
              schema: { type: string }
              description: "POST, GET, OPTIONS"
            access-control-allow-methods:
              schema: { type: string }
              description: "POST, GET, OPTIONS"
            access-control-allow-headers:
              schema: { type: string }
              description: content-type

  /api/engage-access:
    post:
      operationId: site-post-api-engage-access
      summary: Request access to a GovernedUI™ SKU tier (public)
      description: |
        Single canonical entrypoint for every GovernedUI™ access request
        from the public site (constitution §27 §4 dual-channel admin).
        Maps the `tier` field to one of the 5 canonical GovernedUI SKUs
        (pilot → KYE-GUI-PILOT-001, department → KYE-GUI-DEPT-001,
        enterprise → KYE-GUI-ENT-001, regulated → KYE-GUI-REG-001,
        national → KYE-GUI-NAT-001), persists the request to D1, emits
        the engagement-access evidence event to the audit chain, then
        dispatches the §38 admin alert with Approve / Request-changes
        buttons plus an applicant confirmation. The Stripe payment link
        is returned after admin approval, never inline. Rate limit: 3
        per 24 h per IP hash. Honeypot field `website`. Work email
        required.
      tags: [LeadCapture]
      x-kye-source-file: public/site/functions/api/engage-access.js
      x-kye-emits-envelopes: [kye.comms.dispatch.v1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier, name, email, organisation, role, consent_accepted]
              properties:
                tier:
                  type: string
                  enum: [pilot, department, enterprise, regulated, national]
                name: { type: string }
                email: { type: string, format: email, description: Work email — free providers are rejected }
                organisation: { type: string }
                phone: { type: string }
                role: { type: string }
                agent_classes: { type: string, description: Scope — agent classes to govern }
                protected_systems: { type: string, description: Scope — systems the agents touch }
                business_units: { type: string }
                regulatory_exposure: { type: string }
                deployment_topology: { type: string }
                message: { type: string }
                consent_accepted: { type: boolean, description: Must be truthy }
                website: { type: string, description: Honeypot — leave empty }
      responses:
        "200":
          description: >-
            Request recorded (or honeypot discarded with
            `request_id: "discarded"`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  request_id: { type: string, format: uuid }
                  sku_id: { type: string }
                  next_step: { type: string }
        "400":
          description: >-
            Validation failure — `json_parse_failed`, `unknown_tier`
            (body lists the valid tiers), `missing_required_field`,
            `invalid_email`, `work_email_required`, `consent_required`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500":
          description: Unhandled handler exception (message echoed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/expert-review:
    get:
      operationId: site-get-api-expert-review
      summary: List published expert reviews (public)
      description: |
        Lists reviews for the expert wall. Only `status=published` is
        publicly readable; requesting `pending` or `rejected` returns
        401 (moderation listing is owners-only via the Admin Console).
        Without the D1 binding the endpoint degrades to an honest empty
        list (`not_provisioned: true`) so the page still renders.
      tags: [ExpertReviews]
      x-kye-source-file: public/site/functions/api/expert-review.js
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, default: published }
          description: Only `published` is allowed unauthenticated
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: Published reviews, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  not_provisioned: { type: boolean, description: Present when the D1 binding is absent }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        submitted_at: { type: string, format: date-time }
                        name: { type: string }
                        role: { type: string }
                        affiliation: { type: string }
                        artefact: { type: string }
                        review_text: { type: string }
                        verdict: { type: string }
                        linkedin: { type: string }
        "401":
          description: Non-published status requested without owner auth
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: site-post-api-expert-review
      summary: Submit an expert review for moderation (public)
      description: |
        Accepts a review of a named KYE™ artefact (JSON or form-data),
        validates the verdict enum and the optional LinkedIn profile
        URL (https linkedin.com /in or /pub paths only), emits a
        `kye.evidence.audit_event.v1` to the AI Call Ledger queue,
        inserts the row as `status=pending`, then notifies the
        moderation inbox via the §38 `expert-review.brief.v1` template
        with one-click Approve-&-publish / Reject buttons and sends the
        submitter the `expert-review.applicant-ack.v1` receipt (both
        fail-soft — the persisted row is canonical). Rate limit: 3
        submissions per 24 h per day-salted IP hash. Honeypot field
        `website`.
      tags: [ExpertReviews]
      x-kye-source-file: public/site/functions/api/expert-review.js
      x-kye-emits-envelopes: [kye.evidence.audit_event.v1, kye.comms.dispatch.v1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role, affiliation, email, artefact, review_text, verdict]
              properties:
                name: { type: string, maxLength: 200 }
                role: { type: string, maxLength: 200 }
                affiliation: { type: string, maxLength: 200 }
                email: { type: string, format: email, maxLength: 320, description: Used for the receipt + embed code; never published }
                artefact: { type: string, maxLength: 200, description: The KYE artefact reviewed }
                review_text: { type: string, maxLength: 6000 }
                verdict:
                  type: string
                  enum: [approved, approved_with_suggestions, changes_requested, under_discussion]
                linkedin: { type: string, maxLength: 300, description: Optional public LinkedIn profile URL (https only) }
                website: { type: string, description: Honeypot — leave empty }
          application/x-www-form-urlencoded:
            schema:
              type: object
              description: Same fields as the JSON body.
      responses:
        "200":
          description: Review queued for moderation (or honeypot discarded)
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      ok: { type: boolean, enum: [true] }
                      id: { type: string, description: 26-char review id }
                      status: { type: string, enum: [pending] }
                      message: { type: string }
                  - $ref: "#/components/schemas/HoneypotAccepted"
        "400":
          description: >-
